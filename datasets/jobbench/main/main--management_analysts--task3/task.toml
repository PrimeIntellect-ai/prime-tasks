schema_version = "1.4"
artifacts = [
    "/workspace/output",
]

[task]
name = "jobbench/main--management_analysts--task3"
description = "JobBench main task: management_analysts task3"
authors = [
    { name = "JobBench" },
]
keywords = [
    "jobbench",
    "main",
    "management_analysts",
]

[metadata]
id = "main--management_analysts--task3"
split = "main"
occupation = "management_analysts"
task_number = "task3"
repo_id = "JobBench/job-bench"
revision = "d43a66575635da0d3f6cb9a20976dc1a60f3ffc9"

[agent]
timeout_sec = 7200.0
network_mode = "public"

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"
network_mode = "public"

[verifier.env]
JUDGE_API_BASE = "${JUDGE_API_BASE:-https://api.pinference.ai/api/v1}"
JUDGE_API_KEY = "${PRIME_API_KEY}"
JUDGE_MODEL = "${JUDGE_MODEL:-openai/gpt-5.6-luna}"
JUDGE_MAX_WORKERS = "${JUDGE_MAX_WORKERS:-10}"
JUDGE_MAX_RETRIES = "${JUDGE_MAX_RETRIES:-3}"
JUDGE_TIMEOUT_PER_RUBRIC = "${JUDGE_TIMEOUT_PER_RUBRIC:-300}"

[environment]
build_timeout_sec = 1800.0
network_mode = "public"
cpus = 4
memory_mb = 8192
storage_mb = 20480
workdir = "/workspace"
docker_image = "prime/primeintellect/jobbench:660b33a"
