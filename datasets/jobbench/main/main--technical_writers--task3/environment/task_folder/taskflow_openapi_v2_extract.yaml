openapi: "3.0.3"
info:
  title: TaskFlow API
  version: "2.0.1"
  description: Internal OpenAPI specification for TaskFlow platform API.
servers:
  - url: https://api.taskflow.io/api/v2
paths:
  /tasks:
    get:
      operationId: listTasks
      summary: List tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, done, archived, blocked]
        - name: project_id
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
            maximum: 200
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, priority, due_date]
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: label
          in: query
          schema:
            type: string
          description: Filter tasks by label name.
      responses:
        "200":
          description: Paginated list of tasks.
    post:
      operationId: createTask
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 200
                description:
                  type: string
                status:
                  type: string
                  default: open
                priority:
                  type: string
                  enum: [low, medium, high, critical, urgent]
                assignee_id:
                  type: integer
                project_id:
                  type: integer
                due_date:
                  type: string
                  format: date-time
                tags:
                  type: array
                  items:
                    type: string
                watchers:
                  type: array
                  items:
                    type: integer
                  description: User IDs to add as watchers.
      responses:
        "201":
          description: Task created.
        "400":
          description: Bad request.
        "401":
          description: Unauthorized.
        "422":
          description: Validation error.
  /tasks/{taskId}:
    get:
      operationId: getTask
      summary: Retrieve a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
        - name: include
          in: query
          schema:
            type: string
            enum: [comments, history, attachments]
          description: Expand related resources in the response.
      responses:
        "200":
          description: Task details.
        "404":
          description: Task not found.
    put:
      operationId: updateTask
      summary: Update a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                priority:
                  type: string
                assignee_id:
                  type: integer
                  nullable: true
                project_id:
                  type: integer
                due_date:
                  type: string
                  format: date-time
                  nullable: true
                tags:
                  type: array
                  items:
                    type: string
                watchers:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: Updated task.
        "404":
          description: Task not found.
        "409":
          description: Conflict - concurrent modification detected.
    delete:
      operationId: deleteTask
      summary: Delete a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Task deleted.
        "403":
          description: Forbidden.
        "404":
          description: Task not found.
  /tasks/{taskId}/assign:
    post:
      operationId: assignTask
      summary: Assign a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee_id]
              properties:
                assignee_id:
                  type: integer
                notify:
                  type: boolean
                  default: true
                  description: Whether to send a notification to the assignee.
      responses:
        "200":
          description: Task assigned.
        "404":
          description: Task or user not found.
  /projects:
    get:
      operationId: listProjects
      summary: List projects
      parameters:
        - name: archived
          in: query
          schema:
            type: boolean
            default: false
        - name: role
          in: query
          schema:
            type: string
            enum: [owner, admin, member, viewer]
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of projects.
    post:
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                template_id:
                  type: integer
                  description: Create from an existing project template.
                visibility:
                  type: string
                  enum: [private, internal, public]
                  default: private
      responses:
        "201":
          description: Project created.
  /projects/{projectId}:
    get:
      operationId: getProject
      summary: Retrieve a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details.
    put:
      operationId: updateProject
      summary: Update a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                archived:
                  type: boolean
                visibility:
                  type: string
      responses:
        "200":
          description: Updated project.
    delete:
      operationId: deleteProject
      summary: Delete a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: cascade
          in: query
          schema:
            type: boolean
            default: true
          description: If true, deletes all tasks within the project.
      responses:
        "204":
          description: Project deleted.
  /users/me:
    get:
      operationId: getCurrentUser
      summary: Retrieve current user profile
      parameters:
        - name: fields
          in: query
          schema:
            type: string
          description: Comma-separated list of fields to include in the response.
      responses:
        "200":
          description: Current user profile.
  /webhooks:
    post:
      operationId: createWebhook
      summary: Create a webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                    enum:
                      - task.created
                      - task.updated
                      - task.deleted
                      - task.assigned
                      - task.commented
                      - project.created
                      - project.archived
                      - project.deleted
                      - member.added
                      - member.removed
                secret:
                  type: string
                  description: HMAC secret for payload verification.
                active:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Webhook created.
  /webhooks/{webhookId}:
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Webhook deleted.
  /search/tasks:
    get:
      operationId: searchTasks
      summary: Search tasks
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Full-text search query.
        - name: project_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Search results.
  /auth/login:
    post:
      operationId: login
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                mfa_code:
                  type: string
                  description: Required if MFA is enabled on the account.
      responses:
        "200":
          description: Authentication successful.
        "401":
          description: Invalid credentials.
        "403":
          description: MFA required.
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: New token pair issued.
        "401":
          description: Refresh token expired or revoked.
