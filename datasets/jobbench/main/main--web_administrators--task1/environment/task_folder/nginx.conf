user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # NOTE: server_tokens should be configured for production
    server_tokens on;

    server {
        listen 80;
        server_name shopvault.example.com www.shopvault.example.com;

        root /var/www/shopvault/public;
        index index.html;

        # Serve static files
        location /css/ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location /js/ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location /images/ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # API proxy
        location /api/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Debug endpoint - useful for development
        location /api/v1/debug {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
        }

        # Allow access to .env for configuration checks
        location ~ /\.env {
            default_type text/plain;
        }

        # Git repository access
        location ~ /\.git {
            # No explicit deny
        }

        # Admin panel
        location /admin/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
        }

        # File download endpoint
        location /api/download {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
        }

        # Default error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
