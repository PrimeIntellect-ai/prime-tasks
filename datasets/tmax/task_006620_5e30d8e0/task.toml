rubric_reason = "The fixture writes 12 bytes using `struct.pack('<Id', ...)`, but the native C++ `Packet` is typically 16 bytes because `double sensor_val` begins at offset 8. Thus `ifs.read(..., sizeof(p))` leaves part of `sensor_val` uninitialized, so the actual value read immediately before the access is not reliably `-1.5`, contrary to the verifier's exact assertion. The verifier also only runs the executable on this single input, so a dummy executable returning 0 can pass without fixing `main.cpp`."
