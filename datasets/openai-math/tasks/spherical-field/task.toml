schema_version = "1.4"

[task]
name = "openai-math/spherical-field"
version = "1.0.0"
description = "Prove SphericalField (openai/math family 222: Perceptron free energies and microscopic jamming) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "probability-and-statistical-mechanics"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/SphericalField.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "SphericalField"
family = "222"
family_title = "Perceptron free energies and microscopic jamming"
subject = "Probability and statistical mechanics"
theorems = ["OAI.SphericalPerceptron.spherical_linear_field_formula"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Probability.SphericalField.Main"
reference_modules = 142
reference_lean_bytes = 1253471
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 698
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 12828
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
