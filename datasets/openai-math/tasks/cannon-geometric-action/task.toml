schema_version = "1.4"

[task]
name = "openai-math/cannon-geometric-action"
version = "1.0.0"
description = "Prove CannonGeometricAction (openai/math family 246: Cannon's conjecture) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "group-theory"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/CannonGeometricAction.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "CannonGeometricAction"
family = "246"
family_title = "Cannon's conjecture"
subject = "Group theory"
theorems = ["OAI.CannonRelease.cannon"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Geometry.Cannon.Main"
reference_modules = 299
reference_lean_bytes = 2904193
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 1075
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 14313
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
