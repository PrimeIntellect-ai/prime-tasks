schema_version = "1.4"

[task]
name = "openai-math/brenier"
version = "1.0.0"
description = "Prove Brenier (openai/math family 374: Sharp one-third stability of optimal transport maps) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "partial-differential-equations"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/Brenier.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "Brenier"
family = "374"
family_title = "Sharp one-third stability of optimal transport maps"
subject = "Partial differential equations"
theorems = ["OAI.Problem358.one_third_stability", "OAI.Problem358.one_third_exponent_is_sharp"]
definition_holes = []
fixed_definitions = ["OAI.Problem358.E", "OAI.Problem358.uniformMeasure", "OAI.Problem358.IsSupported", "OAI.Problem358.IsCoupling", "OAI.Problem358.quadraticPlanCost", "OAI.Problem358.wasserstein2", "OAI.Problem358.graphPlan", "OAI.Problem358.IsQuadraticOptimalMap", "OAI.Problem358.IsUniqueQuadraticOptimalMap", "OAI.Problem358.mapL2Dist", "OAI.Problem358.cube", "OAI.Problem358.HasExactlyThreeAtoms"]
reference_module = "OAI.Analysis.Brenier.Stability"
reference_modules = 89
reference_lean_bytes = 1532625
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 440
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
# Prime Intellect: prebuilt from environment/ (identical across tasks); Verifiers does not build Dockerfiles.
docker_image = "prime/primeintellect/openai-math:adc7f12-d7056fd-prime1"
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 13079
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
