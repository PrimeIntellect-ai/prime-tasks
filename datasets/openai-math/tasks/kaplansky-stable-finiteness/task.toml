schema_version = "1.4"

[task]
name = "openai-math/kaplansky-stable-finiteness"
version = "1.0.0"
description = "Prove KaplanskyStableFiniteness (openai/math family 294: A counterexample to Kaplansky's quasitrace conjecture) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "operator-algebras"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/KaplanskyStableFiniteness.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "KaplanskyStableFiniteness"
family = "294"
family_title = "A counterexample to Kaplansky's quasitrace conjecture"
subject = "Operator algebras"
theorems = ["OAI.KaplanskyConsequences.stable_finiteness_bundle"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Analysis.Kaplansky.StableFiniteness"
reference_modules = 181
reference_lean_bytes = 1739197
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 720
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
# Prime Intellect: prebuilt from environment/ (identical across tasks); Verifiers does not build Dockerfiles.
docker_image = "prime/primeintellect/openai-math:adc7f12-d7056fd-prime1"
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 13265
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
