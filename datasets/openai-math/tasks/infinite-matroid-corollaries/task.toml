schema_version = "1.4"

[task]
name = "openai-math/infinite-matroid-corollaries"
version = "1.0.0"
description = "Prove InfiniteMatroidCorollaries (openai/math family 185: Counterexamples to infinite matroid intersection and packing/covering) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "combinatorics"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/InfiniteMatroidCorollaries.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "InfiniteMatroidCorollaries"
family = "185"
family_title = "Counterexamples to infinite matroid intersection and packing/covering"
subject = "Combinatorics"
theorems = ["OAI.InfiniteMatroidCounterexample.partitional_intersection_counterexample", "OAI.InfiniteMatroidCounterexample.separate_covering_packing_counterexamples"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Combinatorics.InfiniteMatroid.Corollaries"
reference_modules = 33
reference_lean_bytes = 193312
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 155
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
# Prime Intellect: prebuilt from environment/ (identical across tasks); Verifiers does not build Dockerfiles.
docker_image = "prime/primeintellect/openai-math:adc7f12-d7056fd-prime1"
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 11873
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
