schema_version = "1.4"

[task]
name = "openai-math/strongly-rayleigh-dpp"
version = "1.0.0"
description = "Prove StronglyRayleighDPP (openai/math family 231: The free uniform spanning forest is a factor of IID) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "probability-and-statistical-mechanics"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/StronglyRayleighDPP.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "StronglyRayleighDPP"
family = "231"
family_title = "The free uniform spanning forest is a factor of IID"
subject = "Probability and statistical mechanics"
theorems = ["OAI.Problem336AdditiveD139.finite_strongly_rayleigh_response", "OAI.Problem336AdditiveD139.strongly_rayleigh_group_factor", "OAI.Problem336AdditiveD139.finite_positive_contraction_dpp_is_strongly_rayleigh", "OAI.Problem336AdditiveD139.countable_positive_contraction_dpp_exists_unique", "OAI.Problem336AdditiveD139.invariant_positive_contraction_dpp_factor", "OAI.Problem336AdditiveD139.translation_invariant_kernel_dpp_factor"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Probability.StrongRayleigh.Main"
reference_modules = 107
reference_lean_bytes = 512357
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 364
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
# Prime Intellect: prebuilt from environment/ (identical across tasks); Verifiers does not build Dockerfiles.
docker_image = "prime/primeintellect/openai-math:adc7f12-d7056fd-prime1"
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 12161
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
