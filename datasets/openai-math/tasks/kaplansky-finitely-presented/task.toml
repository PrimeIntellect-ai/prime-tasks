schema_version = "1.4"

[task]
name = "openai-math/kaplansky-finitely-presented"
version = "1.0.0"
description = "Prove KaplanskyFinitelyPresented (openai/math family 197: Nonsofic groups and group-ring counterexamples) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "algebra"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/KaplanskyFinitelyPresented.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "KaplanskyFinitelyPresented"
family = "197"
family_title = "Nonsofic groups and group-ring counterexamples"
subject = "Algebra"
theorems = ["OAI.KaplanskyCounterexample.finitelyPresented_counterexample"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.RingTheory.DirectFiniteness.FinitelyPresented"
reference_modules = 126
reference_lean_bytes = 556097
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 723
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 12200
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
