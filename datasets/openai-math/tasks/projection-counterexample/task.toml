schema_version = "1.4"

[task]
name = "openai-math/projection-counterexample"
version = "1.0.0"
description = "Prove ProjectionCounterexample (openai/math family 088: Petty's projection-volume conjecture and simplex counterexamples) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "convex-and-metric-geometry"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/ProjectionCounterexample.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "ProjectionCounterexample"
family = "088"
family_title = "Petty's projection-volume conjecture and simplex counterexamples"
subject = "Convex and metric geometry"
theorems = ["OAI.ProjectionCounterexample.universal_simplex_upper_bound_false"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Geometry.ProjectionBody.Counterexample"
reference_modules = 41
reference_lean_bytes = 131947
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 142
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
# Prime Intellect: prebuilt from environment/ (identical across tasks); Verifiers does not build Dockerfiles.
docker_image = "prime/primeintellect/openai-math:adc7f12-d7056fd-prime1"
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 11818
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
