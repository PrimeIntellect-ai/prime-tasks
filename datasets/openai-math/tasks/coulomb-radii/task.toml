schema_version = "1.4"

[task]
name = "openai-math/coulomb-radii"
version = "1.0.0"
description = "Prove CoulombRadii (openai/math family 263: The ionization and generalized ionization conjectures) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "mathematical-physics"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/CoulombRadii.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "CoulombRadii"
family = "263"
family_title = "The ionization and generalized ionization conjectures"
subject = "Mathematical physics"
theorems = ["OAI.NeutralAtom.generalized_outer_radii"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Analysis.CoulombRadii.Main"
reference_modules = 428
reference_lean_bytes = 3858816
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 1444
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 15172
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
