schema_version = "1.4"

[task]
name = "openai-math/velocity-hemisphere"
version = "1.0.0"
description = "Prove VelocityHemisphere (openai/math family 220: Directional zero–one laws and ballisticity in random environments) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "probability-and-statistical-mechanics"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/VelocityHemisphere.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "VelocityHemisphere"
family = "220"
family_title = "Directional zero–one laws and ballisticity in random environments"
subject = "Probability and statistical mechanics"
theorems = ["OAI.DirectionalTransience.positive_probability_transience_velocity_hemisphere"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Probability.Ballisticity.VelocityHemisphere"
reference_modules = 585
reference_lean_bytes = 5974000
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 1928
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
# Prime Intellect: prebuilt from environment/ (identical across tasks); Verifiers does not build Dockerfiles.
docker_image = "prime/primeintellect/openai-math:adc7f12-d7056fd-prime1"
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 17076
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
