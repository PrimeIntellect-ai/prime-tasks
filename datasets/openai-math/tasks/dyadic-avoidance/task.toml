schema_version = "1.4"

[task]
name = "openai-math/dyadic-avoidance"
version = "1.0.0"
description = "Prove DyadicAvoidance (openai/math family 084: The geometric case of the Erd\\H{o}s similarity conjecture) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "real-and-complex-analysis"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/DyadicAvoidance.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "DyadicAvoidance"
family = "084"
family_title = "The geometric case of the Erd\\H{o}s similarity conjecture"
subject = "Real and complex analysis"
theorems = ["OAI.Problem310.dyadic_affine_avoidance"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.MeasureTheory.DyadicAvoidance.Main"
reference_modules = 75
reference_lean_bytes = 369234
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 198
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
# Prime Intellect: prebuilt from environment/ (identical across tasks); Verifiers does not build Dockerfiles.
docker_image = "prime/primeintellect/openai-math:adc7f12-d7056fd-prime1"
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 12032
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
