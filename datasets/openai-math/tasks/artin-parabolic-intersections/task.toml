schema_version = "1.4"

[task]
name = "openai-math/artin-parabolic-intersections"
version = "1.0.0"
description = "Prove ArtinParabolicIntersections (openai/math family 254: Classifying spaces and geometric obstructions for Artin groups) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "group-theory"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/ArtinParabolicIntersections.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "ArtinParabolicIntersections"
family = "254"
family_title = "Classifying spaces and geometric obstructions for Artin groups"
subject = "Group theory"
theorems = ["OAI.HarmonicArtin.ParabolicIntersections.unconditional_parabolic_intersections", "OAI.HarmonicArtin.ParabolicIntersections.unconditional_arbitrary_intersections", "OAI.HarmonicArtin.ParabolicIntersections.unconditional_parabolic_closure", "OAI.HarmonicArtin.ParabolicIntersections.unconditional_nonclique_dynamics"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Topology.ArtinGroups.ParabolicIntersections.Main"
reference_modules = 782
reference_lean_bytes = 3300665
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 2200
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
# Prime Intellect: prebuilt from environment/ (identical across tasks); Verifiers does not build Dockerfiles.
docker_image = "prime/primeintellect/openai-math:adc7f12-d7056fd-prime1"
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 14670
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
