schema_version = "1.4"

[task]
name = "openai-math/bin-packing-gap"
version = "1.0.0"
description = "Prove BinPackingGap (openai/math family 118: Unbounded bin-packing gaps and the modified integer round-up conjecture) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "theoretical-computer-science"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/BinPackingGap.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "BinPackingGap"
family = "118"
family_title = "Unbounded bin-packing gaps and the modified integer round-up conjecture"
subject = "Theoretical computer science"
theorems = ["OAI.BinPackingGap.main_results"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Computability.BinPacking.Main"
reference_modules = 284
reference_lean_bytes = 7557041
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 1119
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 18501
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
