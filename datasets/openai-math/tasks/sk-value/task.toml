schema_version = "1.4"

[task]
name = "openai-math/sk-value"
version = "1.0.0"
description = "Prove SKValue (openai/math family 281: QAOA optimality for the SK model) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "mathematical-physics"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/SKValue.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "SKValue"
family = "281"
family_title = "QAOA optimality for the SK model"
subject = "Mathematical physics"
theorems = ["OAI.SKValue.value_consequences"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Probability.SKValue.Main"
reference_modules = 212
reference_lean_bytes = 1487979
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 650
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
# Prime Intellect: prebuilt from environment/ (identical across tasks); Verifiers does not build Dockerfiles.
docker_image = "prime/primeintellect/openai-math:adc7f12-d7056fd-prime1"
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 13039
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
