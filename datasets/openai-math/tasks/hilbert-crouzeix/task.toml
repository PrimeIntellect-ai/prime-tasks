schema_version = "1.4"

[task]
name = "openai-math/hilbert-crouzeix"
version = "1.0.0"
description = "Prove HilbertCrouzeix (openai/math family 325: The complete Crouzeix conjecture) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "functional-analysis"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/HilbertCrouzeix.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "HilbertCrouzeix"
family = "325"
family_title = "The complete Crouzeix conjecture"
subject = "Functional analysis"
theorems = ["OAI.HilbertCrouzeix.numericalClosure_geometry", "OAI.HilbertCrouzeix.exists_finite_compression", "OAI.HilbertCrouzeix.rational_denominator_isUnit", "OAI.HilbertCrouzeix.zeroConclusion"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Analysis.HilbertCrouzeix.Main"
reference_modules = 7
reference_lean_bytes = 36730
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 136
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
# Prime Intellect: prebuilt from environment/ (identical across tasks); Verifiers does not build Dockerfiles.
docker_image = "prime/primeintellect/openai-math:adc7f12-d7056fd-prime1"
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 11733
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
