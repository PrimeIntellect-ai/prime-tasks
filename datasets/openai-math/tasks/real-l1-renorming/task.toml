schema_version = "1.4"

[task]
name = "openai-math/real-l1-renorming"
version = "1.0.0"
description = "Prove RealL1Renorming (openai/math family 330: A negative answer to Kalton's Lipschitz-free approximation question) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "functional-analysis"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/RealL1Renorming.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "RealL1Renorming"
family = "330"
family_title = "A negative answer to Kalton's Lipschitz-free approximation question"
subject = "Functional analysis"
theorems = ["OAI.DiscreteFree.real_l1_quantitative_renorming"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Analysis.LipschitzFree.Renorming"
reference_modules = 33
reference_lean_bytes = 179835
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 172
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 11861
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
