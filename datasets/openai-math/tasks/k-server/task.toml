schema_version = "1.4"

[task]
name = "openai-math/k-server"
version = "1.0.0"
description = "Prove KServer (openai/math family 110: Optimal-order randomized $k$-server on arbitrary metrics) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "theoretical-computer-science"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/KServer.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "KServer"
family = "110"
family_title = "Optimal-order randomized $k$-server on arbitrary metrics"
subject = "Theoretical computer science"
theorems = ["OAI.KServer.main_theorem"]
definition_holes = []
fixed_definitions = ["OAI.KServer.Configuration", "OAI.KServer.LabelDistribution", "OAI.KServer.Policy", "OAI.KServer.serve", "OAI.KServer.serviceCost", "OAI.KServer.pathProbability", "OAI.KServer.expectedCost", "OAI.KServer.optimalCost", "OAI.KServer.MainStatement"]
reference_module = "OAI.Combinatorics.KServer.Main"
reference_modules = 37
reference_lean_bytes = 1783312
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 322
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 13304
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
