schema_version = "1.4"

[task]
name = "openai-math/tree-edit"
version = "1.0.0"
description = "Prove TreeEdit (openai/math family 099: The sharp distortion of edit distance into $\\ell_1$) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "convex-and-metric-geometry"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/TreeEdit.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "TreeEdit"
family = "099"
family_title = "The sharp distortion of edit distance into $\\ell_1$"
subject = "Convex and metric geometry"
theorems = ["OAI.TreeEdit.binary_torus"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Combinatorics.TreeEdit.TorusLowerBound"
reference_modules = 22
reference_lean_bytes = 243012
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 167
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
# Prime Intellect: prebuilt from environment/ (identical across tasks); Verifiers does not build Dockerfiles.
docker_image = "prime/primeintellect/openai-math:adc7f12-d7056fd-prime1"
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 11918
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
