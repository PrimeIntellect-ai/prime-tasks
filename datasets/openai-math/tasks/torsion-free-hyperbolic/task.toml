schema_version = "1.4"

[task]
name = "openai-math/torsion-free-hyperbolic"
version = "1.0.0"
description = "Prove TorsionFreeHyperbolic (openai/math family 252: A non-residually-finite torsion-free hyperbolic group) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "group-theory"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/TorsionFreeHyperbolic.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "TorsionFreeHyperbolic"
family = "252"
family_title = "A non-residually-finite torsion-free hyperbolic group"
subject = "Group theory"
theorems = ["OAI.Release075.main"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.GroupTheory.Hyperbolic.Main"
reference_modules = 29
reference_lean_bytes = 482151
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 216
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 12133
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
