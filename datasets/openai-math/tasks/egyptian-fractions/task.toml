schema_version = "1.4"

[task]
name = "openai-math/egyptian-fractions"
version = "1.0.0"
description = "Prove EgyptianFractions (openai/math family 025: Erd\\H{o}s’s short Egyptian-fraction conjecture) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "number-theory"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/EgyptianFractions.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "EgyptianFractions"
family = "025"
family_title = "Erd\\H{o}s’s short Egyptian-fraction conjecture"
subject = "Number theory"
theorems = ["OAI.Problem337.egyptian_length_is_minimum", "OAI.Problem337.main_double_log_order", "OAI.Problem337.one_expansions_finite_and_bounded", "OAI.Problem337.counting_double_log_order", "OAI.Problem337.exact_marker_padding", "OAI.Problem337.every_exact_marker_occurs", "OAI.Problem337.quantitative_marked_length", "OAI.Problem337.missing_denominator_semantics", "OAI.Problem337.prescribed_denominator_corollary"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.NumberTheory.EgyptianFractions.Main"
reference_modules = 290
reference_lean_bytes = 1625178
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 832
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 13162
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
