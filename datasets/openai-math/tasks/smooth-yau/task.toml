schema_version = "1.4"

[task]
name = "openai-math/smooth-yau"
version = "1.0.0"
description = "Prove SmoothYau (openai/math family 350: Yau's nodal conjecture: surfaces and counterexamples) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "differential-geometry"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/SmoothYau.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "SmoothYau"
family = "350"
family_title = "Yau's nodal conjecture: surfaces and counterexamples"
subject = "Differential geometry"
theorems = ["OAI.YauCounterexamples.sphere_three", "OAI.YauCounterexamples.sphere_two_torus_two"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Geometry.SmoothYau.Main"
reference_modules = 436
reference_lean_bytes = 4544098
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 1965
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 15789
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
