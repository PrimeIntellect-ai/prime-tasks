schema_version = "1.4"

[task]
name = "openai-math/regular-parity"
version = "1.0.0"
description = "Prove RegularParity (openai/math family 274: Moore's parity conjecture for $\\mathrm{QAC}^0$) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "mathematical-physics"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/RegularParity.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "RegularParity"
family = "274"
family_title = "Moore's parity conjecture for $\\mathrm{QAC}^0$"
subject = "Mathematical physics"
theorems = ["OAI.QAC.parity_lower_bound_polynomial_size"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.InformationTheory.QuantumCircuit.Main"
reference_modules = 22
reference_lean_bytes = 154244
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 185
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
# Prime Intellect: prebuilt from environment/ (identical across tasks); Verifiers does not build Dockerfiles.
docker_image = "prime/primeintellect/openai-math:adc7f12-d7056fd-prime1"
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 11838
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
