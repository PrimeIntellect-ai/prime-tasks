schema_version = "1.4"

[task]
name = "openai-math/sat-variance"
version = "1.0.0"
description = "Prove SATVariance (openai/math family 235: Random-SAT thresholds, sharp variance and computability) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "probability-and-statistical-mechanics"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/SATVariance.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "SATVariance"
family = "235"
family_title = "Random-SAT thresholds, sharp variance and computability"
subject = "Probability and statistical mechanics"
theorems = ["OAI.RandomKSAT.variance_main"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Probability.SATVariance.Main"
reference_modules = 35
reference_lean_bytes = 299818
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 245
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 11969
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
