schema_version = "1.4"

[task]
name = "openai-math/invariant-ising"
version = "1.0.0"
description = "Prove InvariantIsing (openai/math family 234: All-temperature pressure for orthogonally invariant Ising spin glasses) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "probability-and-statistical-mechanics"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/InvariantIsing.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "InvariantIsing"
family = "234"
family_title = "All-temperature pressure for orthogonally invariant Ising spin glasses"
subject = "Probability and statistical mechanics"
theorems = ["OAI.InvariantIsing.limiting_pressure_of_extreme_limits_unconditional", "OAI.InvariantIsing.limiting_wasserstein_field_pressure_of_extreme_limits_unconditional", "OAI.InvariantIsing.positive_temperature_pressure_unconditional", "OAI.InvariantIsing.ground_state_limit_unconditional", "OAI.InvariantIsing.random_pressure_tendsto_in_measure_unconditional", "OAI.InvariantIsing.random_pressure_limit_unconditional", "OAI.InvariantIsing.random_pressure_tendsto_ae_unconditional", "OAI.InvariantIsing.random_field_pressure_tendsto_ae_unconditional", "OAI.InvariantIsing.gaussianPattern_pressure_limit_unconditional", "OAI.InvariantIsing.gaussianPattern_ground_limit_unconditional", "OAI.InvariantIsing.gaussianPattern_norm_limits_unconditional"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Probability.InvariantIsing.Unconditional"
reference_modules = 2123
reference_lean_bytes = 10537287
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 5030
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 21183
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
