challenge = "LogKodairaFiberNegative"
family = "033"
family_title = "Campana's orbifold Iitaka conjecture and logarithmic subadditivity"
subject = "Algebraic and complex geometry"
theorems = ["OAI.ReverseLogKodaira.SmoothProjectiveVariety.veryGenerally_fiber_negative_branch"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.AlgebraicGeometry.LogKodaira.FiberNegative"
