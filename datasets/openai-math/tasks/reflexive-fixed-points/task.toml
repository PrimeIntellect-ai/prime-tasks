schema_version = "1.4"

[task]
name = "openai-math/reflexive-fixed-points"
version = "1.0.0"
description = "Prove ReflexiveFixedPoints (openai/math family 328: Fixed points of nonexpansive maps in reflexive Banach spaces) in Lean 4 with Mathlib; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "theorem-proving", "openai-math", "functional-analysis"]

[metadata]
source = "https://github.com/openai/math"
source_commit = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
source_license = "Apache-2.0"
source_notice = "tests/Challenge.lean is lean/ComparatorChallenges/ReflexiveFixedPoints.lean from openai/math, (c) OpenAI, unchanged; see NOTICE at the dataset root"
challenge = "ReflexiveFixedPoints"
family = "328"
family_title = "Fixed points of nonexpansive maps in reflexive Banach spaces"
subject = "Functional analysis"
theorems = ["OAI.ReflexiveFixedPoints.exists_fixedPoint_of_canonicallyReflexive"]
definition_holes = []
fixed_definitions = []
reference_module = "OAI.Analysis.Nonexpansive.Main"
reference_modules = 86
reference_lean_bytes = 480875
reference_requires_packages = []
oracle_result = "accepted"
oracle_grade_seconds = 221
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 5400
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
# Lean sees all host CPUs rather than the sandbox's 4; this bounds `lake build` to 3 parallel jobs.
env = { LEAN_NUM_THREADS = "3" }

[verifier]
timeout_sec = 12132
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/openai-math/pack_submission.py"
timeout_sec = 300
