schema_version = "1.3"
source = "ProgramBench"

# Cleanroom images: generated tasks default to upstream ProgramBench v6
# (`programbench/*:task_cleanroom_v6`).  Exceptions: tinycc, doxygen, revive, dirble,
# and chafa use `bencalvert04/*` until upstream ships fixes — see adapter
# `MIRROR_PATCHED_INSTANCE_IDS`.
# Agent phase uses network_mode = "allowlist" (cleanroom contract). Verifier runs in
# a separate sandbox (environment_mode = "separate") with default network for HF blobs.
# allowed_hosts is LLM APIs only; mini-swe-agent + uv are baked in environment/Dockerfile.
#
# Harness fixes (evaluator, verifier Dockerfile) live in task-template/tests/ and are
# copied into every generated task on `programbench-adapter --overwrite`.
#
# Two roles in this artifacts list:
#   1) trial outputs: /logs/verifier/* — collected from the verifier sandbox to the host
#   2) agent→verifier handoff: /workspace — copied from the agent sandbox to the
#      verifier sandbox, with ./executable excluded so the reference binary cannot
#      be passed across the boundary as a cheat. Hash-scrub inside the verifier
#      remains a second-layer defense.
artifacts = [
  "/logs/verifier/programbench_eval.json",
  "/logs/verifier/harbor_diagnostics.json",
  "/logs/verifier/programbench_eval.log",
  "/logs/verifier/reward.json",
  "/logs/verifier/reward.txt",
  { source = "/workspace", exclude = ["executable"] },
]

[task]
name = "programbench/hatoo--oha.8dc6349"
description = "ProgramBench cleanroom reconstruction task for hatoo/oha"
authors = [
  { name = "John Yang" },
  { name = "Kilian Lieret" },
]
keywords = ["programbench", "reverse-engineering", "software-engineering", "cleanroom", "rs"]

[metadata]
source = "ProgramBench"
instance_id = "hatoo__oha.8dc6349"
repository = "hatoo/oha"
commit = "8dc63499f84b3116652987dac711eca687ccc2fd"
language = "rs"
difficulty = "medium"
task_image = "programbench/hatoo_1776_oha.8dc6349:task_v6"
cleanroom_image = "programbench/hatoo_1776_oha.8dc6349:task_cleanroom_v6"
test_branches = 12
test_count = 1095

[agent]
timeout_sec = 14400
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com"]

[verifier]
timeout_sec = 7200
environment_mode = "separate"

# Individual terminal fixtures allocate their own PTYs, as in upstream grading.
[verifier.env]
PROGRAMBENCH_SCRIPT_PTY = "0"

# Published verifier image is built from tests/Dockerfile, which
# starts FROM the cleanroom image and wipes /workspace so the reference
# binary baked into the image cannot survive into the verification phase.
[verifier.environment]
docker_image = "prime/primeintellect/programbench-verifier.x86.hatoo--oha.8dc6349:qc-81a527b5a440"
build_timeout_sec = 1800
cpus = 12
memory_mb = 8192
storage_mb = 30720
gpus = 0
workdir = "/workspace"

[environment]
docker_image = "programbench/hatoo_1776_oha.8dc6349:task_cleanroom_v6"
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com"]
build_timeout_sec = 1800
cpus = 12
memory_mb = 8192
storage_mb = 30720
gpus = 0
workdir = "/workspace"
