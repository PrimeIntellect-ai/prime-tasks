# Merged on top of harbor's own compose layers. The world boots from a shared
# image and is seeded per trial from a read-only mount, so no trial can alter
# what the next one reads.
services:
  world:
    image: "public.ecr.aws/k4t1e3r5/harbor-hub@sha256:6f701086a272048ec054fe803dbf258297df47e3ee62191349f58c31cd6970e5"
    expose:
      - "8000"
    volumes:
      - "./task_files/.harbor/mcp_config.json:/world/mcp_config.json:ro"
      - "world_logs:/logs/world"
    environment:
      PORT: "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,os,sys,urllib.request\nsys.exit(1) if not os.path.exists('/logs/world/.initial_snapshot_done') else None\nb=json.dumps({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2024-11-05','capabilities':{},'clientInfo':{'name':'healthcheck','version':'0'}}}).encode()\nr=urllib.request.Request('http://localhost:8000/mcp',data=b,headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream'},method='POST')\nurllib.request.urlopen(r,timeout=10).read(1)\n"]
      interval: 10s
      timeout: 15s
      retries: 120
      start_period: 300s
  main:
    depends_on:
      world:
        condition: service_healthy
    volumes:
      - "world_logs:/logs/world:ro"
    environment:
      FIREWORKS_AI_API_KEY: "${FIREWORKS_AI_API_KEY:-}"
      FIREWORKS_API_KEY: "${FIREWORKS_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
volumes:
  world_logs:
