[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-mocha && git add -A && git diff --cached --binary 744d7fa0154472bc256459c5686930ef961cddeb > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
