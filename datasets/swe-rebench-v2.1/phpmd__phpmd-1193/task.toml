[task]
name = "ibragim-badertdinov/phpmd__phpmd-1193"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "php"]
repo = "phpmd/phpmd"
language = "php"
log_parser = "parse_log_phpunit"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/phpmd"
docker_image = "docker.io/swerebenchv2/phpmd-phpmd:1193-b9e5df9@sha256:c35c88e7881d6b57bdd090d7b8da605804144e272a4c669d7a9c0f01a38f11c7"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /phpmd && git add -A && git diff --cached --binary b9e5df99f52c640e49840fefbcaccbb0edf70161 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
