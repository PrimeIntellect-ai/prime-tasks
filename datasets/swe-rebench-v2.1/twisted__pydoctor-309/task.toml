[task]
name = "ibragim-badertdinov/twisted__pydoctor-309"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "twisted/pydoctor"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/pydoctor"
docker_image = "docker.io/swerebenchv2/twisted-pydoctor:309-b3ff995@sha256:f1a86b57485ad96a9b00dbc1c44e82835222916ff256c273ef0f158ea2ab7bd1"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pydoctor && git add -A && git diff --cached --binary b3ff995a50a6ad29ebe88ba4884831ee0eb77599 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
