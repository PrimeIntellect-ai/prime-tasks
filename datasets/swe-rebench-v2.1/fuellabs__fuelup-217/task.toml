[task]
name = "ibragim-badertdinov/fuellabs__fuelup-217"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "FuelLabs/fuelup"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/fuelup"
docker_image = "docker.io/swerebenchv2/fuellabs-fuelup:217-b03ff8c@sha256:08e8a08e85765cd73ab975f4718058f1c62c5ddc6392f9dbc9382e7c1f1bc5d0"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /fuelup && git add -A && git diff --cached --binary b03ff8cc6b7d4d49cafbf76b6dabc81f122edcd6 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
