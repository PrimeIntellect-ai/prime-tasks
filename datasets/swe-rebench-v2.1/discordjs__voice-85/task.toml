[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/voice"
docker_image = "docker.io/swerebenchv2/discordjs-voice:85-b5385fc@sha256:a8b8c2f2cfcdb6189f6b213a4bb54d17ecd9bce591a96f06ba5833460b6fd8ad"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /voice && git add -A && git diff --cached --binary b5385fcf3386e4f42e8857e50a4d6e11a8e9c4d0 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
