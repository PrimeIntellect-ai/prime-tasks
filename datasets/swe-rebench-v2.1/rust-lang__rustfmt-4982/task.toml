[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rustfmt"
docker_image = "docker.io/swerebenchv2/rust-lang-rustfmt:4982-3d8cd57@sha256:619f3f85ec397fbf8bce3c92bbdc23d55b408d02cc1d6eacf153710e237baddd"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rustfmt && git add -A && git diff --cached --binary 3d8cd57c2f166cb92204e95a5f4c73ab20fed4f2 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
