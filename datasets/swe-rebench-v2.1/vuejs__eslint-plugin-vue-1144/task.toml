[task]
name = "ibragim-badertdinov/vuejs__eslint-plugin-vue-1144"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "vuejs/eslint-plugin-vue"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-vue"
docker_image = "docker.io/swerebenchv2/vuejs-eslint-plugin-vue:1144-c54b13a@sha256:28fbe62e59be584d9306e2d59681460cea87b5745b6e697c464dbd36f3ae52e3"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-vue && git add -A && git diff --cached --binary c54b13aedd6eb5c5a67e895e534044f6a18dfc8b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
