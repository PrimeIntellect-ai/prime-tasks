[task]
name = "ibragim-badertdinov/palantir__policy-bot-447"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "palantir/policy-bot"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/policy-bot"
docker_image = "docker.io/swerebenchv2/palantir-policy-bot:447-5998aa9@sha256:3b94fb6ed989c8f0cc01f5efbcbf85c3671f95fb831fb57a79857e57914fa784"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /policy-bot && git add -A && git diff --cached --binary 5998aa9e4007495f9dc3a134acafbb7bbea7a049 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
