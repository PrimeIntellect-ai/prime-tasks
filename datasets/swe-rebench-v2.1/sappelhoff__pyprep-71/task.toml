[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pyprep && git add -A && git diff --cached --binary 0fa6ac41acbe0e31228a54e3ec022505d2826137 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
