[task]
name = "ibragim-badertdinov/rezact__rezact-23"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "Rezact/Rezact"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/Rezact"
docker_image = "docker.io/swerebenchv2/rezact-rezact:23-1da8eb9@sha256:6624fbbd0e7d3501a8028a8594a1f3b7db8b8e7e39b1a54771d9680fb489ae12"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /Rezact && git add -A && git diff --cached --binary 1da8eb90f10023754a2586b44439a16457320738 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
