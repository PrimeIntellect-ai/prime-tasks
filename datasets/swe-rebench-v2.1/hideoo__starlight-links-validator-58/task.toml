[task]
name = "ibragim-badertdinov/hideoo__starlight-links-validator-58"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "HiDeoo/starlight-links-validator"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/starlight-links-validator"
docker_image = "docker.io/swerebenchv2/hideoo-starlight-links-validator:58-1b9eee0@sha256:cc791d820544869649447c9973e71d7e00988d88be9bfdf14134a203a3835aeb"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /starlight-links-validator && git add -A && git diff --cached --binary 1b9eee00db614e1c3fe7923ee8df9542ddfc3498 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
