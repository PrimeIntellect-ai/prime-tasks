[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sushi && git add -A && git diff --cached --binary e047891b7bd553fedc071ec91c9c9acd7740e64e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
