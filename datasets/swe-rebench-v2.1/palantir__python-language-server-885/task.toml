[task]
name = "ibragim-badertdinov/palantir__python-language-server-885"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "palantir/python-language-server"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/python-language-server"
docker_image = "docker.io/swerebenchv2/palantir-python-language-server:885-cf59b8f@sha256:c830ceb34897f665f5ddad4276ca8c64125d68bdad08605abb2144d7e581be8c"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /python-language-server && git add -A && git diff --cached --binary cf59b8f558cc8121c5fe2de6db70ab91560e2da8 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
