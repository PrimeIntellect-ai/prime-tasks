[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-tasks && git add -A && git diff --cached --binary cad0391d2a3267eb3682a012d2dded3c0f0e4c98 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
