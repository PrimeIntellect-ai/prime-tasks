[task]
name = "ibragim-badertdinov/jest-community__eslint-plugin-jest-923"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "jest-community/eslint-plugin-jest"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-jest"
docker_image = "docker.io/swerebenchv2/jest-community-eslint-plugin-jest:923-5c0d28f@sha256:e6b28958ebb007d9bb12a1ccc62b0328e6d92b00e2ac856d4660d946b80e4f70"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-jest && git add -A && git diff --cached --binary 5c0d28f85c5bfeb1e47cfe49d07e20d9730e44a3 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
