[task]
name = "ibragim-badertdinov/nix-community__nixpkgs-fmt-73"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "nix-community/nixpkgs-fmt"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/nixpkgs-fmt"
docker_image = "docker.io/swerebenchv2/nix-community-nixpkgs-fmt:73-0306370@sha256:13cc7e742f462372fbbe8e78ca7d50293e1f2858fb3e6feb76732d7c1281cc11"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /nixpkgs-fmt && git add -A && git diff --cached --binary 03063703441c68d9e388870e8a42a4a3fe504cf8 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
