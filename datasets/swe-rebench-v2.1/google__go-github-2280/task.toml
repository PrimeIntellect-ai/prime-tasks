[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /go-github && git add -A && git diff --cached --binary e1c28bc999c58ce0ab110d9721ec731b1595f6b1 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
