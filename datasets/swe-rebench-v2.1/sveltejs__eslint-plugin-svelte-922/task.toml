[task]
name = "ibragim-badertdinov/sveltejs__eslint-plugin-svelte-922"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "sveltejs/eslint-plugin-svelte"
language = "ts"
log_parser = "parse_log_js_2"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-svelte"
docker_image = "docker.io/swerebenchv2/sveltejs-eslint-plugin-svelte:922-b384d57@sha256:7df51a968630d73566fb1ebf48c3f218ff67083956fdb43198d7a8792ce2acbb"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-svelte && git add -A && git diff --cached --binary b384d57857927b108e03c90d30ded9f179de3d4e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
