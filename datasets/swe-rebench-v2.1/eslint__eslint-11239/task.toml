[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint && git add -A && git diff --cached --binary 258b6541f61dc3a9ae64e200680766a11c3dd316 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
