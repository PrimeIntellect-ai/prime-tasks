[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /cfn-lint && git add -A && git diff --cached --binary d0aae9bd6e3615e8d1023ca3c5c5aca1992d8a87 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
