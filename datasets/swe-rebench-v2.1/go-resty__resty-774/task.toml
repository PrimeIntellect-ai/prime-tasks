[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /resty && git add -A && git diff --cached --binary 0ac42a2c104d83091e0456dca71bbdc85093ccf5 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
