[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /liquid-rust && git add -A && git diff --cached --binary ed9385a1a46e6beaf811e161fffb1cced79085b4 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
