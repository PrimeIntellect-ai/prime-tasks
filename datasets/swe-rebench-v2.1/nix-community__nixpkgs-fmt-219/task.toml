[task]
name = "ibragim-badertdinov/nix-community__nixpkgs-fmt-219"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "nix-community/nixpkgs-fmt"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/nixpkgs-fmt"
docker_image = "docker.io/swerebenchv2/nix-community-nixpkgs-fmt:219-025292e@sha256:f3951d4e6851e8b870a4a110afa849198767b2501bb6d7cd2cc16ebc18cda450"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /nixpkgs-fmt && git add -A && git diff --cached --binary 025292e583d585c2951040ff4c4717885fab9c91 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
