[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /dtsgenerator && git add -A && git diff --cached --binary c242d8338218c7ff595c73a4e2fdf10a20ed0ce1 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
