[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /tailwindcss-jit && git add -A && git diff --cached --binary c0f01a6926cb63dc44f32431e559158ff6dc2198 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
