[task]
name = "ibragim-badertdinov/semantic-release__gitlab-365"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "semantic-release/gitlab"
language = "js"
log_parser = "parse_log_js"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/gitlab"
docker_image = "docker.io/swerebenchv2/semantic-release-gitlab:365-83f3d32@sha256:1e14a78e1909f5d69d95d3e3ecdacb03b55a8a713bf2776161c91d79e323af37"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /gitlab && git add -A && git diff --cached --binary 83f3d32bf0d2a8791b5e468f48e94a13de61b18b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
