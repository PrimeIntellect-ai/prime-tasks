[task]
name = "ibragim-badertdinov/bazelbuild__bazelisk-256"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "bazelbuild/bazelisk"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/bazelisk"
docker_image = "docker.io/swerebenchv2/bazelbuild-bazelisk:256-d5eed30@sha256:b51fa5d27e0e54af5adf590283476d9c378e1b4b60c83b1553c0899dcfb3e721"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /bazelisk && git add -A && git diff --cached --binary d5eed3077bac3db4d5e1b5e7d476a1f8f022184f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
