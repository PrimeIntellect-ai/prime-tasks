[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/phpbench"
docker_image = "docker.io/swerebenchv2/phpbench-phpbench:833-c14a7bf@sha256:11a4231596d581b735039499dcef8e88bcb79ae1447c893441c5aaac340c5d24"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /phpbench && git add -A && git diff --cached --binary c14a7bf02439e455f6de95295b850998e1307567 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
