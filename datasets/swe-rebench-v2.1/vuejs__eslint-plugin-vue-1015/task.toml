[task]
name = "ibragim-badertdinov/vuejs__eslint-plugin-vue-1015"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "vuejs/eslint-plugin-vue"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-vue"
docker_image = "docker.io/swerebenchv2/vuejs-eslint-plugin-vue:1015-99fe70d@sha256:2e958b95e2662db06e4e0002583649560caaaf0ce2111fddeb3941cf2fac3d4f"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-vue && git add -A && git diff --cached --binary 99fe70dd45097ed4a7c8bdc60cf98e30ee57afac > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
