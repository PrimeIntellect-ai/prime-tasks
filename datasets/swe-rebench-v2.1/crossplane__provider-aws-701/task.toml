[task]
name = "ibragim-badertdinov/crossplane__provider-aws-701"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "crossplane/provider-aws"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/provider-aws"
docker_image = "docker.io/swerebenchv2/crossplane-provider-aws:701-bccdbb2@sha256:8e485f522bc072e245bd1817988a90d72145052a7dd02189065fe52e53ddc274"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /provider-aws && git add -A && git diff --cached --binary bccdbb2591fd95df1d02a90b5b4f3cc6a770b9c5 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
