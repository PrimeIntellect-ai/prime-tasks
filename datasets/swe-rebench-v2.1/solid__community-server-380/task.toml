[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /community-server && git add -A && git diff --cached --binary 82393ed33bd146023a65025d758f33559eacfc11 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
