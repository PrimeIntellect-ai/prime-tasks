[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /oxc-resolver && git add -A && git diff --cached --binary dbe3a22997a309292d5381e9dac9cfae09510630 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
