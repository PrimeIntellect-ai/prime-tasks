[task]
name = "ibragim-badertdinov/vuejs__eslint-plugin-vue-1071"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "vuejs/eslint-plugin-vue"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-vue"
docker_image = "docker.io/swerebenchv2/vuejs-eslint-plugin-vue:1071-ab3bf36@sha256:6e4a4bfe0291501ab1356a6160e64cd3d93654e6badc4f78f17272c46d706a16"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-vue && git add -A && git diff --cached --binary ab3bf3629fcccf032ef320b704a5b8b4f9dcafdc > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
