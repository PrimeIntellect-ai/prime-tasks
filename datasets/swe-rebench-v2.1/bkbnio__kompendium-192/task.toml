[task]
name = "ibragim-badertdinov/bkbnio__kompendium-192"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "kotlin"]
repo = "bkbnio/kompendium"
language = "kotlin"
log_parser = "parse_log_gradlew_v1"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/kompendium"
docker_image = "docker.io/swerebenchv2/bkbnio-kompendium:192-2cebb66@sha256:2e0bfcc75bb85ba3cfb801e05396bc18dc9b1078ec65605e980b3efad015509d"
env = { _JAVA_OPTIONS = "" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /kompendium && git add -A && git diff --cached --binary 2cebb661341f379157d9c63fa7a56b80995be3f4 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
