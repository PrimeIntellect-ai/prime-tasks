[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-linter && git add -A && git diff --cached --binary 0ba13e2b1da042d1bd3d1e546e991962148086e6 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
