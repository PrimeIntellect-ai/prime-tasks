[task]
name = "ibragim-badertdinov/platers__obsidian-linter-978"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "platers/obsidian-linter"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/obsidian-linter"
docker_image = "docker.io/swerebenchv2/platers-obsidian-linter:978-8fa7618@sha256:524cd0a8710aab9efd852ee95e1d436f72d95825678faa31dd90c9fb6e4c90b4"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-linter && git add -A && git diff --cached --binary 8fa7618adcbbf56b1bd85f1e037e5cd7454c0c87 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
