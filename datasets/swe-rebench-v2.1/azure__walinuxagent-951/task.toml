[task]
name = "ibragim-badertdinov/azure__walinuxagent-951"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "Azure/WALinuxAgent"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/WALinuxAgent"
docker_image = "docker.io/swerebenchv2/azure-walinuxagent:951-ab261b5@sha256:fd7e51dd5663b9e5d0e424e80d0afdd58325564b3e999bc0ed57f40b10900d06"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /WALinuxAgent && git add -A && git diff --cached --binary ab261b5f2ed0dfce4dd94adf924e68e0aaff5e7b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
