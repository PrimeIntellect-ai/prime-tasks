[task]
name = "ibragim-badertdinov/nix-community__nixpkgs-fmt-168"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "nix-community/nixpkgs-fmt"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/nixpkgs-fmt"
docker_image = "docker.io/swerebenchv2/nix-community-nixpkgs-fmt:168-9f4cca7@sha256:b1bad49b898d26f860b14807c17ccc615640c713a15e0435fd9834498704303d"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /nixpkgs-fmt && git add -A && git diff --cached --binary 9f4cca7f14a9e1d88ccdd240e87df025c6330446 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
