[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/packaging"
docker_image = "docker.io/swerebenchv2/pypa-packaging:71-7b77a6f@sha256:9849cde0fd2135d4184cab7cb05fbc86f72ca7bda1fed56288653334ba88d8fd"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /packaging && git add -A && git diff --cached --binary 7b77a6faec6956a8e0bdec844b615e59baf1ff52 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
