[task]
name = "ibragim-badertdinov/clojure-lsp__clojure-lsp-145"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "clojure"]
repo = "clojure-lsp/clojure-lsp"
language = "clojure"
log_parser = "parse_log_lein"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/clojure-lsp"
docker_image = "docker.io/swerebenchv2/clojure-lsp-clojure-lsp:145-0b3363e@sha256:cd2c3dd8ba13741564db6b773dee0170bb84b0edea538d329fe571d53a4bf3d1"
env = { JAVA_TOOL_OPTIONS = "-Dfile.encoding=UTF-8" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /clojure-lsp && git add -A && git diff --cached --binary 0b3363e3d440262084f42e490a9297c3571dce9b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
