[task]
name = "ibragim-badertdinov/networknt__json-schema-validator-137"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "java"]
repo = "networknt/json-schema-validator"
language = "java"
log_parser = "parse_java_mvn"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/json-schema-validator"
docker_image = "docker.io/swerebenchv2/networknt-json-schema-validator:137-d615f95@sha256:a89974e543cf1e6f663e5d292bcc2b922724cda2baff8754f864ba274c515bea"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /json-schema-validator && git add -A && git diff --cached --binary d615f95238c3b755d67505144372b25fcadffd6b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
