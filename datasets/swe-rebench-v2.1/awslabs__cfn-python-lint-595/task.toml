[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /cfn-python-lint && git add -A && git diff --cached --binary a8d5bcd75e181f4ee5ce050c2774a22dc4671b90 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
