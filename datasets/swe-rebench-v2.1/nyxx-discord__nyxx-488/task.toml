[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /nyxx && git add -A && git diff --cached --binary ee2167ac9fc9aafabb6ebdcbdf9d3afe09cc2f8c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
