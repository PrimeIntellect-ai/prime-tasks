[task]
name = "ibragim-badertdinov/pypa__packaging-47"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "pypa/packaging"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/packaging"
docker_image = "docker.io/swerebenchv2/pypa-packaging:47-8cd4476@sha256:a26e013d401b9e650317343d85fa0bee4bd05708d4a4821e8f4c03fbd54167d6"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /packaging && git add -A && git diff --cached --binary 8cd44767cd01a897af0ac79217b77c8ffe6ec837 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
