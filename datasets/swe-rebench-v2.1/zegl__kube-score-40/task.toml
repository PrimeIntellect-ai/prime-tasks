[task]
name = "ibragim-badertdinov/zegl__kube-score-40"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "zegl/kube-score"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/kube-score"
docker_image = "docker.io/swerebenchv2/zegl-kube-score:40-7ba74b1@sha256:cd8904eba6a676b0d1b5430edee5c642ee30b6cda54b06c424f4b77756799b21"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /kube-score && git add -A && git diff --cached --binary 7ba74b11d1e4cb6fe9629a7d8c1a5c4b393594d6 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
