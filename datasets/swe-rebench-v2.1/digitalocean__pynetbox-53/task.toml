[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pynetbox && git add -A && git diff --cached --binary 07b71c2301f0ad9b55a4098adda65acfeab58372 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
