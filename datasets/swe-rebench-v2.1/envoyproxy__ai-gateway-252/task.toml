[task]
name = "ibragim-badertdinov/envoyproxy__ai-gateway-252"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "envoyproxy/ai-gateway"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/ai-gateway"
docker_image = "docker.io/swerebenchv2/envoyproxy-ai-gateway:252-4af86e5@sha256:6a0ac3e2c05f82ff61cc8f6c461edac594459b12d9edddbb197c3860873e4eba"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /ai-gateway && git add -A && git diff --cached --binary 4af86e5a103fbaeed80cdbe13230e3da12aaddcc > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
