[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /glam-rs && git add -A && git diff --cached --binary 5fd61e965f777dc0e3c3d353e9007e5a7c957304 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
