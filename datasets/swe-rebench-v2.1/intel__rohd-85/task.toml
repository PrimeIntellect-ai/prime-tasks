[task]
name = "ibragim-badertdinov/intel__rohd-85"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "dart"]
repo = "intel/rohd"
language = "dart"
log_parser = "parse_log_dart"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rohd"
docker_image = "docker.io/swerebenchv2/intel-rohd@sha256:4e2e5c678a3980ae724195ea6d2f0ef2c01bea46b92a946d1fcb4bd6e5ea8a6e"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rohd && git add -A && git diff --cached --binary 4f568aa4db008db3870f468659cd0429e8ac5a92 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
