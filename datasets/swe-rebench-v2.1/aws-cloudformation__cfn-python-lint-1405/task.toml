[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/cfn-python-lint"
docker_image = "docker.io/swerebenchv2/aws-cloudformation-cfn-python-lint:1405-c9d78f4@sha256:f8f90ce6a07a6bf7455a674abc89f134d60cf802346dfedb241b7cc74375e06a"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /cfn-python-lint && git add -A && git diff --cached --binary c9d78f4e8a53e5357902734d9d00814da99ba7b9 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
