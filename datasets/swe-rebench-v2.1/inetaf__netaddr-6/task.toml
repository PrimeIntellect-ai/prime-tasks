[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/netaddr"
docker_image = "docker.io/swerebenchv2/inetaf-netaddr:6-68d3e5b@sha256:0b89933c3cd43eba1b5b4609243a879bf2c73b854106a792b4c6ce6404a1b29e"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /netaddr && git add -A && git diff --cached --binary 68d3e5b23db06b2f91654777bf1f793407f69c70 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
