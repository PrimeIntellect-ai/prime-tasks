[task]
name = "ibragim-badertdinov/google__yamlfmt-4"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "google/yamlfmt"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/yamlfmt"
docker_image = "docker.io/swerebenchv2/google-yamlfmt:4-07d5e88@sha256:a3625cb091d4f55403796fed7451ed60866fa8112dc672be1e98dd225fec88e1"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /yamlfmt && git add -A && git diff --cached --binary 07d5e88f96d4edadf70ad91c8ebcf2d285924a47 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
