[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /nexus && git add -A && git diff --cached --binary c4bcb620edc4403a42b6dc964058a84656d5bccb > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
