[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/kube-score"
docker_image = "docker.io/swerebenchv2/zegl-kube-score:55-5cab1a0@sha256:fd4d04d4670973cb911305f3fe5e3b59e34883dff3525bf3d8b7e8266f3ffca9"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /kube-score && git add -A && git diff --cached --binary 5cab1a0761eac41e3a5003c8e62445015d27e659 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
