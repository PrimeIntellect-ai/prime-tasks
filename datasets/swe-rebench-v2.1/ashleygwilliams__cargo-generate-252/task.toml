[task]
name = "ibragim-badertdinov/ashleygwilliams__cargo-generate-252"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "ashleygwilliams/cargo-generate"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/cargo-generate"
docker_image = "docker.io/swerebenchv2/ashleygwilliams-cargo-generate:252-ef3a8bd@sha256:5d16306e3f0a3d4bdfd5907eaaa0c715fa7ef2f6236100e7a6ef405930d045e0"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /cargo-generate && git add -A && git diff --cached --binary ef3a8bddf455376a9128a5a14f479f81f0d4c80c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
