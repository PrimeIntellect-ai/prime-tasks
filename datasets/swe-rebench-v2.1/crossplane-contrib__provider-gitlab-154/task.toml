[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /provider-gitlab && git add -A && git diff --cached --binary 4d3cc79672fa539fbd8ecf3778b0bc70e2eff629 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
