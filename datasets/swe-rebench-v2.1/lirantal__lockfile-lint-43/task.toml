[task]
name = "ibragim-badertdinov/lirantal__lockfile-lint-43"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "lirantal/lockfile-lint"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/lockfile-lint"
docker_image = "docker.io/swerebenchv2/lirantal-lockfile-lint:43-6c86dfc@sha256:aad018a92e7349a39fd033af178de533d1136af2cc8d39bf3f4cd0d1e20cc0f7"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /lockfile-lint && git add -A && git diff --cached --binary 6c86dfc306bbfd4c82166cbbdad2bdd9899308cf > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
