[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /fuelup && git add -A && git diff --cached --binary 784edcddd8dc28b7499b4410d5c3fc8802ebe281 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
