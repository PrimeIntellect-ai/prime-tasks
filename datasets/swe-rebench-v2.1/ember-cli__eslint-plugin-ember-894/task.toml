[task]
name = "ibragim-badertdinov/ember-cli__eslint-plugin-ember-894"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "ember-cli/eslint-plugin-ember"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-ember"
docker_image = "docker.io/swerebenchv2/ember-cli-eslint-plugin-ember:894-aa7b664@sha256:2030c5efb73f673a9130fb804ebde868e4a319d1e2fb89df8ce1d9c6abf4e3bd"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-ember && git add -A && git diff --cached --binary aa7b664a5a24f02108decc149e7642a892f663b2 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
