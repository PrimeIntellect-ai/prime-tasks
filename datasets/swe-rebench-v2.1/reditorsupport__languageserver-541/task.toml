[task]
name = "ibragim-badertdinov/reditorsupport__languageserver-541"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "r"]
repo = "REditorSupport/languageserver"
language = "r"
log_parser = "parse_log_r"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/languageserver"
docker_image = "docker.io/swerebenchv2/reditorsupport-languageserver:541-5fc32c3@sha256:e9736593cb71daae00402e1079f7cac3c56446f4fde1510faee6dac86945b694"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /languageserver && git add -A && git diff --cached --binary 5fc32c3d3a0e1f14881f6fb00953b4442dd74981 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
