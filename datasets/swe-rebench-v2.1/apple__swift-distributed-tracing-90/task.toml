[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /swift-distributed-tracing && git add -A && git diff --cached --binary b7a1e20ee0e9d31b04b5c5918ced565d6e6e55c1 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
