[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/spectator"
docker_image = "docker.io/swerebenchv2/hotmeteor-spectator:89-edc2248@sha256:33de31041d098be196e205e737b656a8b56b9aa11815d81fa5512644003f7336"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /spectator && git add -A && git diff --cached --binary edc2248df91a2d61fa7a86f0e6d28fe38b1bab14 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
