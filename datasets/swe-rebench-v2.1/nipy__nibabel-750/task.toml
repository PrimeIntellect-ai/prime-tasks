[task]
name = "ibragim-badertdinov/nipy__nibabel-750"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "nipy/nibabel"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/nibabel"
docker_image = "docker.io/swerebenchv2/nipy-nibabel:750-e7e3668@sha256:b681a724cae8c765fa42d0408f43c325707dbf5b973201f03d368b83b5a8293d"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /nibabel && git add -A && git diff --cached --binary e7e3668e52eda7869bafd43f0cda462800ee37f0 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
