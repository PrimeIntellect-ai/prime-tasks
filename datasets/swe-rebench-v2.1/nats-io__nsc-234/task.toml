[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /nsc && git add -A && git diff --cached --binary e11a210124b124d55d933b28b1c32b0b3e5c9cc5 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
