[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /go-sdk && git add -A && git diff --cached --binary b624a43fc2fa132399543de79b9ecf5008312aaf > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
