[task]
name = "ibragim-badertdinov/cakephp__chronos-435"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "php"]
repo = "cakephp/chronos"
language = "php"
log_parser = "parse_log_phpunit"
