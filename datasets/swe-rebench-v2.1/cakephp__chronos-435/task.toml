[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/chronos"
docker_image = "docker.io/swerebenchv2/cakephp-chronos:435-1b563f0@sha256:f9fbce20012a880b89c401eea5ee62aaeabad10e67809060e503dea6e0edee31"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /chronos && git add -A && git diff --cached --binary 1b563f03f8cfe3f9d26ff68288b6a6e5f681b4a9 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
