[task]
name = "ibragim-badertdinov/newrelic__elixir_agent-58"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "elixir"]
repo = "newrelic/elixir_agent"
language = "elixir"
log_parser = "parse_log_elixir"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/elixir_agent"
docker_image = "docker.io/swerebenchv2/newrelic-elixir-agent:58-ae4d5d3@sha256:f288cf39e82d6d49311ca76b9ce0dab599cd1a7df888c0f33eeaea285e5ff562"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /elixir_agent && git add -A && git diff --cached --binary ae4d5d309419e31e3b3f729c6515018504635c74 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
