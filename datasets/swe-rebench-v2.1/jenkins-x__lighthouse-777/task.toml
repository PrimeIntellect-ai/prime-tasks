[task]
name = "ibragim-badertdinov/jenkins-x__lighthouse-777"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "jenkins-x/lighthouse"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/lighthouse"
docker_image = "docker.io/swerebenchv2/jenkins-x-lighthouse:777-691be96@sha256:2d88476deacfbf35a6b96c2a58c2f1b35a4b12b8f40fbe3eebe15c988fa3b19c"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /lighthouse && git add -A && git diff --cached --binary 691be9677ee2b8c6b623ecbbb09c1860faf39d77 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
