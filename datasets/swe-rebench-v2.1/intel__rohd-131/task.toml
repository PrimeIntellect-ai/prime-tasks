[task]
name = "ibragim-badertdinov/intel__rohd-131"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "dart"]
repo = "intel/rohd"
language = "dart"
log_parser = "parse_log_dart"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rohd"
docker_image = "docker.io/swerebenchv2/intel-rohd@sha256:eda8087e27c20c1f413e6b751a8d0d57618563cd35ba5c6efb42fb78ce983e99"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rohd && git add -A && git diff --cached --binary ffa65c55b33f6b29a19943c16f02367028c944f1 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
