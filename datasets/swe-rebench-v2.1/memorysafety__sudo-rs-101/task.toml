[task]
name = "ibragim-badertdinov/memorysafety__sudo-rs-101"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "memorysafety/sudo-rs"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/sudo-rs"
docker_image = "docker.io/swerebenchv2/memorysafety-sudo-rs:101-fe7ff63@sha256:429b007a8d4626b50b54580db2f2eec6d5ae365e120d18421648136b22d9704f"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sudo-rs && git add -A && git diff --cached --binary fe7ff6385491bb8c67eaedf39858f384ef605195 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
