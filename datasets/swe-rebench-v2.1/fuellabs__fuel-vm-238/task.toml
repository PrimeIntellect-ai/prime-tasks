[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/fuel-vm"
docker_image = "docker.io/swerebenchv2/fuellabs-fuel-vm:238-85ecc43@sha256:9ad34c684e6ad97ba428bca94e8dab01bb9e4c504f177cd67e8876b77b7c79a6"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /fuel-vm && git add -A && git diff --cached --binary 85ecc4383148ebadf101012647766e6c1e29e458 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
