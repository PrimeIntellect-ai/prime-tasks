[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /swagger && git add -A && git diff --cached --binary b4c3c5eb79fe204b4b758bfcd4bfad0ee8e5fab1 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
