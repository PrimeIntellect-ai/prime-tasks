[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /policy-bot && git add -A && git diff --cached --binary aa419953f4b9bfad66af0e61e6d1cf8d782a9822 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
