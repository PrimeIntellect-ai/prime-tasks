[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/obsidian-tasks"
docker_image = "docker.io/swerebenchv2/obsidian-tasks-group-obsidian-tasks:2022-2bf2947@sha256:6b2981a07945be6d9bf12d5d6db4ce623ce7304365049a885657e1e2d0dede2b"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-tasks && git add -A && git diff --cached --binary 2bf2947c5a03f35b6c047981f6aac4ccf424c430 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
