[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /hertz && git add -A && git diff --cached --binary efde5b605c7f41d0c65b66e40b2846254d3b321f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
