[task]
name = "ibragim-badertdinov/goreleaser__nfpm-601"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "goreleaser/nfpm"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/nfpm"
docker_image = "docker.io/swerebenchv2/goreleaser-nfpm:601-b547d33@sha256:f4c585d652ea08174f38eaeb0994bd9a30e4a659fea2e2abc01c7faf5e128be5"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /nfpm && git add -A && git diff --cached --binary b547d33731995914394f3aface4bd98fd108c827 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
