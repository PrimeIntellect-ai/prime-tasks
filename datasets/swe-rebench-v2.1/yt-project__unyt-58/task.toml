[task]
name = "ibragim-badertdinov/yt-project__unyt-58"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "yt-project/unyt"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/unyt"
docker_image = "docker.io/swerebenchv2/yt-project-unyt:58-ef43c27@sha256:84014ac5d3623300da17ff07f1a80d63a45e2e92e65871ccc0a4168786489550"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /unyt && git add -A && git diff --cached --binary ef43c2728d63cfa575ee10a239dcd2a636c2ba06 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
