[task]
name = "ibragim-badertdinov/ioos__compliance-checker-730"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "ioos/compliance-checker"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/compliance-checker"
docker_image = "docker.io/swerebenchv2/ioos-compliance-checker:730-380e16a@sha256:b5d496a78db82aa52b955e4fe8c24eb583d7394c9bbba4a9cd3acd9921b0075a"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /compliance-checker && git add -A && git diff --cached --binary 380e16a4f84135605632d75e398564d6885d0de1 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
