[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /yamlfmt && git add -A && git diff --cached --binary d7d54224e0019d1d8cf2e1e5005c2194ec085209 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
