[task]
name = "ibragim-badertdinov/pycqa__docformatter-195"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "PyCQA/docformatter"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/docformatter"
docker_image = "docker.io/swerebenchv2/pycqa-docformatter:195-d12620f@sha256:079fd4b7eaf3e7cfe3babe9ab40f8cd4ed0d48359bfc49eb3c981597e769558b"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /docformatter && git add -A && git diff --cached --binary d12620fb9640a919ee6663dcb8a838a13b471dca > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
