[task]
name = "ibragim-badertdinov/swift-server__swiftly-77"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "swift"]
repo = "swift-server/swiftly"
language = "swift"
log_parser = "parse_log_swift"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/swiftly"
docker_image = "docker.io/swerebenchv2/swift-server-swiftly:77-438b30c@sha256:8d5a6afaea81b215434fdb83b791bc813b8006023f9e66ea6bcc878ef044be23"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /swiftly && git add -A && git diff --cached --binary 438b30cbb2bacd4eb8e0ef08f35a14ddde40a119 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
