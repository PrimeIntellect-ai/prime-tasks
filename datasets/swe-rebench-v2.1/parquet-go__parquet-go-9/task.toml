[task]
name = "ibragim-badertdinov/parquet-go__parquet-go-9"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "parquet-go/parquet-go"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = ["weak_f2p"]

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/parquet-go"
docker_image = "docker.io/swerebenchv2/parquet-go-parquet-go:9-3e09dd9@sha256:c73a28e8206104209ef7f844e0bd09fd56d5a4b6a7603e1fde4ce5c0d94362f0"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /parquet-go && git add -A && git diff --cached --binary 3e09dd9327432ca73f8011c347d4660768ff4111 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
