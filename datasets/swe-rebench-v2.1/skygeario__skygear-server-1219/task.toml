[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/skygear-server"
docker_image = "docker.io/swerebenchv2/skygeario-skygear-server:1219-7a9c9f1@sha256:d7a9ecd0cc6ce32e61a9e40adfdb0f696c67a9ab0f2caa3ac9756c22b0ecdac0"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /skygear-server && git add -A && git diff --cached --binary 7a9c9f1c6464b6ae2c007e312c7a652532e2fb0c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
