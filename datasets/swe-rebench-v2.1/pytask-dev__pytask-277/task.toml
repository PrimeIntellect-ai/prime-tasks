[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pytask && git add -A && git diff --cached --binary e60c8a01b1ab0203c02ed6ba60bb1e0403db139a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
