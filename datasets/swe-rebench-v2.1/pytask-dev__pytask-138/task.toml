[task]
name = "ibragim-badertdinov/pytask-dev__pytask-138"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "pytask-dev/pytask"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/pytask"
docker_image = "docker.io/swerebenchv2/pytask-dev-pytask:138-edcdc24@sha256:a4491f2b41d59af63206e3cff39d0600e334e645e76de1184deb398a7f87ff90"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pytask && git add -A && git diff --cached --binary edcdc248102d03eb4d8524441e9a52c35323be6a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
