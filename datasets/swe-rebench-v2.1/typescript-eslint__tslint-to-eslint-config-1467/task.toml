[task]
name = "ibragim-badertdinov/typescript-eslint__tslint-to-eslint-config-1467"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "typescript-eslint/tslint-to-eslint-config"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/tslint-to-eslint-config"
docker_image = "docker.io/swerebenchv2/typescript-eslint-tslint-to-eslint-config:1467-cea555e@sha256:93346a9e461fef7ea2ca0e8e0bbe96ffff3e060a6c70dd76fbc2c6c5d17b0c97"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /tslint-to-eslint-config && git add -A && git diff --cached --binary cea555e89190f577b8743e1e30c3d444f74f20be > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
