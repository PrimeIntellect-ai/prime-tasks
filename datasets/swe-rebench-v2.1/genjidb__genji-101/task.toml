[task]
name = "ibragim-badertdinov/genjidb__genji-101"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "genjidb/genji"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/genji"
docker_image = "docker.io/swerebenchv2/genjidb-genji:101-4774f69@sha256:48a89e4a76addb6061fe13968ba99b9e38f07b61ec4d7f65e81aca9b00668b5b"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /genji && git add -A && git diff --cached --binary 4774f69cd4a01932f1c01195c278016f2a3e3ddc > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
