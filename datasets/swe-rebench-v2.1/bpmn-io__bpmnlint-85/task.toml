[task]
name = "ibragim-badertdinov/bpmn-io__bpmnlint-85"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "bpmn-io/bpmnlint"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/bpmnlint"
docker_image = "docker.io/swerebenchv2/bpmn-io-bpmnlint:85-e8cbfcc@sha256:6439671cf35f4417bfb45b37db2c46fb58cb43ba5ed02ea84554e64d9fd4b9d1"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /bpmnlint && git add -A && git diff --cached --binary e8cbfccbaa1ccc6e6ea65a36ad36a30eab26f56d > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
