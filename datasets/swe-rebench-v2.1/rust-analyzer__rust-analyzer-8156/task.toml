[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rust-analyzer && git add -A && git diff --cached --binary 97fe64a5c7d68a40adf7b88d5cc992f9f3066537 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
