[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /napalm && git add -A && git diff --cached --binary d0d2a3e70d21d0556de71ab0462bd71a1450f820 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
