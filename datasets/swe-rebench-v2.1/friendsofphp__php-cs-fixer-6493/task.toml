[task]
name = "ibragim-badertdinov/friendsofphp__php-cs-fixer-6493"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "php"]
repo = "FriendsOfPHP/PHP-CS-Fixer"
language = "php"
log_parser = "parse_log_phpunit"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/PHP-CS-Fixer"
docker_image = "docker.io/swerebenchv2/friendsofphp-php-cs-fixer:6493-366dea2@sha256:900d0f4db1a506b5248a7beb40d221905f5b15a22435daa3798192bd402b4136"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /PHP-CS-Fixer && git add -A && git diff --cached --binary 366dea2fde82aa6dfc4c848282dd8e6a6b5881ac > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
