[task]
name = "ibragim-badertdinov/pycqa__docformatter-115"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "PyCQA/docformatter"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/docformatter"
docker_image = "docker.io/swerebenchv2/pycqa-docformatter:115-214a0cd@sha256:4c95c02af9d09aa26d1821602266c9e62e4b67405bc0ce1f0c57b4a0f38040fc"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /docformatter && git add -A && git diff --cached --binary 214a0cd5569576f61bdd5f71e46117f098fb1cab > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
