[task]
name = "ibragim-badertdinov/cloudflare__cloudflare-go-969"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "cloudflare/cloudflare-go"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/cloudflare-go"
docker_image = "docker.io/swerebenchv2/cloudflare-cloudflare-go:969-e1e5cad@sha256:b898053e2f874a3a4514732adaa941e8ba94419db610669b546aef98e5ae99d0"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /cloudflare-go && git add -A && git diff --cached --binary e1e5cadeea19f2714836bd5a086fec54297b180e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
