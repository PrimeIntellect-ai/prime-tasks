[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /cookiecutter && git add -A && git diff --cached --binary ba5ba8c78e97f5dc7fb4e16c588d7be037e6e5e7 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
