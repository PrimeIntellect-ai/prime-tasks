[task]
name = "ibragim-badertdinov/swiftlang__swift-syntax-1820"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "swift"]
repo = "swiftlang/swift-syntax"
language = "swift"
log_parser = "parse_log_swift"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/swift-syntax"
docker_image = "docker.io/swerebenchv2/swiftlang-swift-syntax:1820-49b3bbd@sha256:b5f60cebf6cb52143381a9826ae1a5be0a00fec177ffa08b7cc013dd783569b6"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /swift-syntax && git add -A && git diff --cached --binary 49b3bbdf3b7b044f2a512c67bdb2da0bbd31342f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
