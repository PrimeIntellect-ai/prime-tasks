[task]
name = "ibragim-badertdinov/googleapis__java-storage-19"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "java"]
repo = "googleapis/java-storage"
language = "java"
log_parser = "parse_java_mvn"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/java-storage"
docker_image = "docker.io/swerebenchv2/googleapis-java-storage:19-fda3eda@sha256:a6081335d624b12868f602a1ca0508d797e3251a1c68df49d0ed77154d250db8"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /java-storage && git add -A && git diff --cached --binary fda3eda591352a06816fd82df598123add2789e8 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
