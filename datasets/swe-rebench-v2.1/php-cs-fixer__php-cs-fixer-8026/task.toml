[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /PHP-CS-Fixer && git add -A && git diff --cached --binary cd1922bfdd9d66a2f8fb6555455176ce5e95210d > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
