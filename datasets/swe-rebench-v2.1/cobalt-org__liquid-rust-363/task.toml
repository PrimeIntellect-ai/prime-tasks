[task]
name = "ibragim-badertdinov/cobalt-org__liquid-rust-363"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "cobalt-org/liquid-rust"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/liquid-rust"
docker_image = "docker.io/swerebenchv2/cobalt-org-liquid-rust:363-bd2ecd0@sha256:9284c0fc0b72e280645ef5211e2fa366458d8b81dc15d7e2432fc29bc1fd6b77"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /liquid-rust && git add -A && git diff --cached --binary bd2ecd031fa27ca32d20a1020384b3278d993961 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
