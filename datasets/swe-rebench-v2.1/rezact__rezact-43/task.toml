[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/Rezact"
docker_image = "docker.io/swerebenchv2/rezact-rezact:43-ad8790f@sha256:7d10b1e9d2767afcf25b6425a0d40d45dfef92cf92c5062c731881b666327bf9"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /Rezact && git add -A && git diff --cached --binary ad8790f61b1941f7a47cc372bfe959b949597a09 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
