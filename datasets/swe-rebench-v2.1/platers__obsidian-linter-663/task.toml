[task]
name = "ibragim-badertdinov/platers__obsidian-linter-663"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "platers/obsidian-linter"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/obsidian-linter"
docker_image = "docker.io/swerebenchv2/platers-obsidian-linter:663-fb5b8e3@sha256:8c1bf9b578f8f42ce3b6bdbaf33d97b4d1f0178c90a4e8fca3aaaa62872afccd"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-linter && git add -A && git diff --cached --binary fb5b8e3f22d31675a324b81620f99718690ecf9b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
