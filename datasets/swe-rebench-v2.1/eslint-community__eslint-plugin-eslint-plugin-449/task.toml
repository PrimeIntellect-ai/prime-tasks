[task]
name = "ibragim-badertdinov/eslint-community__eslint-plugin-eslint-plugin-449"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "eslint-community/eslint-plugin-eslint-plugin"
language = "js"
log_parser = "parse_log_js"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-eslint-plugin"
docker_image = "docker.io/swerebenchv2/eslint-community-eslint-plugin-eslint-plugin:449-29ddd2e@sha256:072a8774d7a550ecbb96e498bdc2f22277eb634350e5be0e06029c274cf7ca47"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-eslint-plugin && git add -A && git diff --cached --binary 29ddd2ea5e489ba8df9f2d3cc8b3df85ec69c04a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
