[task]
name = "ibragim-badertdinov/square__anvil-95"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "kotlin"]
repo = "square/anvil"
language = "kotlin"
log_parser = "parse_log_gradlew_v1"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/anvil"
docker_image = "docker.io/swerebenchv2/square-anvil:95-433b2a2@sha256:f58c15ac5d64338ac5320a8721da03a62d8c6613ba603fb5919282cd8ecac901"
env = { _JAVA_OPTIONS = "" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /anvil && git add -A && git diff --cached --binary 433b2a234fb91f51a7fd368e4e5213d991e4358f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
