[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /bytes && git add -A && git diff --cached --binary 54f5ced6c58c47f721836a9444654de4c8d687a1 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
