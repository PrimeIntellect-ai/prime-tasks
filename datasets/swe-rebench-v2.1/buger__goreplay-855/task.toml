[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /goreplay && git add -A && git diff --cached --binary 3aec926ad9a25b57cc512223f4084371e7c0efac > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
