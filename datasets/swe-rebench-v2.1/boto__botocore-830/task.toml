[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /botocore && git add -A && git diff --cached --binary 80cc4c39e6c4f24f85ef376569a59ca2e74fd9ea > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
