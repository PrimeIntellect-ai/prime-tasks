[task]
name = "ibragim-badertdinov/kinto__kinto-2011"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "Kinto/kinto"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/kinto"
docker_image = "docker.io/swerebenchv2/kinto-kinto:2011-c65f829@sha256:f4ef5230e5c0829f113b48888e6c2704cc2d37b4121be40a09eb031c8ee63cd6"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /kinto && git add -A && git diff --cached --binary c65f8290f1daa0d56f04a1cc061286c955366a4f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
