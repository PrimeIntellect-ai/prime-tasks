[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sushi && git add -A && git diff --cached --binary dd4e6b92d4f016eb2c0d1302981e2c96c1790344 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
