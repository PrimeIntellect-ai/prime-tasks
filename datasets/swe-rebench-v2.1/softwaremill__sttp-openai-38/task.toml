[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sttp-openai && git add -A && git diff --cached --binary 8e3278f0752dd27d5a66b7e9cdcaa5e5f1d88c46 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
