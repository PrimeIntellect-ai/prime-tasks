[task]
name = "ibragim-badertdinov/editorconfig-checker__editorconfig-checker-331"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "editorconfig-checker/editorconfig-checker"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/editorconfig-checker"
docker_image = "docker.io/swerebenchv2/editorconfig-checker-editorconfig-checker:331-b82a9c2@sha256:3ac23a2ed6f93ce03e72ddf9272fb821fffe749773ff2e517d4704d0a8fc724d"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /editorconfig-checker && git add -A && git diff --cached --binary b82a9c28ab59bfda8897328a5ec1db4c21b1d5d1 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
