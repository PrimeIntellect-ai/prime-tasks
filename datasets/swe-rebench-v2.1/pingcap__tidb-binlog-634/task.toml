[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /tidb-binlog && git add -A && git diff --cached --binary b892cf58206d16200f669f9c5a045450fa3c4dd6 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
