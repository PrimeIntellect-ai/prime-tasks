[task]
name = "ibragim-badertdinov/boto__botocore-852"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "boto/botocore"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/botocore"
docker_image = "docker.io/swerebenchv2/boto-botocore:852-0d22abf@sha256:cda551c845399926dd3ff689f4cecbb8c62846bf70924474bc9a3ae364b716a9"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /botocore && git add -A && git diff --cached --binary 0d22abf7ed52831f97b3805be29c548298316a23 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
