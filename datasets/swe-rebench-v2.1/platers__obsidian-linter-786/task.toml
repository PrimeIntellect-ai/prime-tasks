[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-linter && git add -A && git diff --cached --binary c5dae1fa422d44093a91c36eae1c0e82de2b019c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
