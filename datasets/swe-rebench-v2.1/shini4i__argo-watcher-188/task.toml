[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/argo-watcher"
docker_image = "docker.io/swerebenchv2/shini4i-argo-watcher:188-1ec21d1@sha256:a810b87bde706dcf7157be6c800396a08916db183db625b3800c966ac79307fb"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /argo-watcher && git add -A && git diff --cached --binary 1ec21d14b0101ca40b6ff1b005dd42659f95a796 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
