[task]
name = "ibragim-badertdinov/solid__community-server-1040"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "solid/community-server"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/community-server"
docker_image = "docker.io/swerebenchv2/solid-community-server:1040-b0208bf@sha256:acaf69c5afe464b142de1cb09492b2cdd602dbb4eb3ce77c3a0b9b83018506df"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /community-server && git add -A && git diff --cached --binary b0208bf4699ce96c4e30ab6603089c1d8b5f2aef > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
