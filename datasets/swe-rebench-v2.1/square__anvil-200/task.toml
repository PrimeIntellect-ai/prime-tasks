[task]
name = "ibragim-badertdinov/square__anvil-200"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "kotlin"]
repo = "square/anvil"
language = "kotlin"
log_parser = "parse_log_gradlew_v1"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/anvil"
docker_image = "docker.io/swerebenchv2/square-anvil:200-7785d0c@sha256:8c085b31707b3670e299c3cb0ce67fd9eba9843a2a07633647bbaa5b45d34a3f"
env = { _JAVA_OPTIONS = "" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /anvil && git add -A && git diff --cached --binary 7785d0c94a2bc900e0f8b257ec368636df38273f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
