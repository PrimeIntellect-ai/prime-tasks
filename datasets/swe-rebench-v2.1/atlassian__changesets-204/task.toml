[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/changesets"
docker_image = "docker.io/swerebenchv2/atlassian-changesets:204-da11ab8@sha256:bcb6d7c2e5d8e4968744a0540e6622bfb951ab760ff870c09d87c6b463787573"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /changesets && git add -A && git diff --cached --binary da11ab8a4e4324a7023d12f990beec8c3b6ae35f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
