[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "scala"]
repo = "softwaremill/elasticmq"
language = "scala"
log_parser = "parse_log_scala_v3"
