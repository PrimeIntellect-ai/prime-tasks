[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /elasticmq && git add -A && git diff --cached --binary bf7e3904f62f81f7644f49c73e72597effe64c19 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
