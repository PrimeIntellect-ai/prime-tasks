[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/zulip-terminal"
docker_image = "docker.io/swerebenchv2/zulip-zulip-terminal:1521-e5e9010@sha256:007f6a2dd429925608d447327b001f546c651a580ee14324319af80fb6ef2ec6"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /zulip-terminal && git add -A && git diff --cached --binary e5e9010850ab4c678890686e3707d7e3e842385e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
