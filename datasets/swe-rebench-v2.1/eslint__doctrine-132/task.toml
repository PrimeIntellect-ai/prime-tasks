[task]
name = "ibragim-badertdinov/eslint__doctrine-132"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "eslint/doctrine"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/doctrine"
docker_image = "docker.io/swerebenchv2/eslint-doctrine:132-110f96e@sha256:d7ed32c05e3155f789e68cdfa4dec627ebaabe415622d1f4eb0f842a5fc88c82"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /doctrine && git add -A && git diff --cached --binary 110f96ec8155c5d4ac088d13a9d5371b908b52e4 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
