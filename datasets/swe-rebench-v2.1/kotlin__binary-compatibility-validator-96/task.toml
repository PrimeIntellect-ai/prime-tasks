[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /binary-compatibility-validator && git add -A && git diff --cached --binary 89ad35ec75dcbb6ede9b72f7185416783828db02 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
