[task]
name = "ibragim-badertdinov/netlify__gocommerce-192"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "netlify/gocommerce"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/gocommerce"
docker_image = "docker.io/swerebenchv2/netlify-gocommerce:192-80355c4@sha256:bda2afb61ca82cb694c0a7ffa0087af57eaa954afdeb569076ace271e534cc1e"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /gocommerce && git add -A && git diff --cached --binary 80355c494df0d94178bfdde45c1b09098c0a258a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
