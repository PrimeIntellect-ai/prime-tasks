[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /typedorm && git add -A && git diff --cached --binary 8d2a8a116bc8cfeda4429726cefea39b31ceae73 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
