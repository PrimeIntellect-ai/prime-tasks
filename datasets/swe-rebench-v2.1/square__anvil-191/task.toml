[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/anvil"
docker_image = "docker.io/swerebenchv2/square-anvil:191-268e4c5@sha256:216fedf9034c9669e6f2a228ec2e60389eb3b1d28c2fe4d5aa5a14b80b0dfe2a"
env = { _JAVA_OPTIONS = "" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /anvil && git add -A && git diff --cached --binary 268e4c53fd4a866b220d06d0287c5a782c0d020b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
