[task]
name = "ibragim-badertdinov/segmentio__parquet-go-492"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "segmentio/parquet-go"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = ["weak_f2p"]

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/parquet-go"
docker_image = "docker.io/swerebenchv2/segmentio-parquet-go:492-219dfcf@sha256:a576e5a88cfdd8a8b2838fc959490214b0e0eb344273620dbbcaa4d5df464131"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /parquet-go && git add -A && git diff --cached --binary 219dfcfcd6f368b4467f45226885a9fc51e28f9c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
