[task]
name = "ibragim-badertdinov/qiskit__qiskit-terra-9000"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "Qiskit/qiskit-terra"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/qiskit-terra"
docker_image = "docker.io/swerebenchv2/qiskit-qiskit-terra:9000-471e8b5@sha256:af9ce9705cff7ed31710843602de0adfa032955fdc1df8bc51163e53e7f82502"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /qiskit-terra && git add -A && git diff --cached --binary 471e8b5cdab5287705b60c70c11c9d7e2dcad0b4 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
