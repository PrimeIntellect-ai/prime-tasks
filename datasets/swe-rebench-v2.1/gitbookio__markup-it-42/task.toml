[task]
name = "ibragim-badertdinov/gitbookio__markup-it-42"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "GitbookIO/markup-it"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/markup-it"
docker_image = "docker.io/swerebenchv2/gitbookio-markup-it:42-5d7ff86@sha256:5b48b39e6d56517e515cff9f914f0a4e593701e6a895009021f50b2ea2924218"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /markup-it && git add -A && git diff --cached --binary 5d7ff8646af05bb621ff5be0825fb3ab99dd90ba > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
