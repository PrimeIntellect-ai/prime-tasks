[task]
name = "ibragim-badertdinov/ajalt__mordant-83"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "kotlin"]
repo = "ajalt/mordant"
language = "kotlin"
log_parser = "parse_log_gradlew_v1"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/mordant"
docker_image = "docker.io/swerebenchv2/ajalt-mordant:83-4ee6adc@sha256:3712b7acca74a623f414fd61b61010891a2ff55b64306c2692eff755ab7a53de"
env = { _JAVA_OPTIONS = "" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /mordant && git add -A && git diff --cached --binary 4ee6adc3200b20d64148b504f347fcc284e2c9ca > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
