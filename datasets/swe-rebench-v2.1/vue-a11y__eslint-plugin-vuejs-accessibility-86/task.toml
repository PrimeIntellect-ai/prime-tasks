[task]
name = "ibragim-badertdinov/vue-a11y__eslint-plugin-vuejs-accessibility-86"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "vue-a11y/eslint-plugin-vuejs-accessibility"
language = "ts"
log_parser = "parse_log_js_4"
