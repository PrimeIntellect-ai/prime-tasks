[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-vuejs-accessibility && git add -A && git diff --cached --binary 9edda182bf52569f709e545361be73d1917283d5 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
