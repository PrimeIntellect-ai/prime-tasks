[task]
name = "ibragim-badertdinov/cloudreach__sceptre-413"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "cloudreach/sceptre"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/sceptre"
docker_image = "docker.io/swerebenchv2/cloudreach-sceptre:413-bf555e1@sha256:2899982040064606c3626cfbf8f52c0ddc2f76457602dd9aa16209ee8c466c52"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sceptre && git add -A && git diff --cached --binary bf555e1082106d5bd5a6da2ccb67624ee3f74382 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
