[task]
name = "ibragim-badertdinov/pytask-dev__pytask-142"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "pytask-dev/pytask"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/pytask"
docker_image = "docker.io/swerebenchv2/pytask-dev-pytask:142-f35b184@sha256:2b95ecbe3b4a708a556ede40841afb630e0c86ea11df2f7a9527d3e9de663160"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pytask && git add -A && git diff --cached --binary f35b1842a4e25fe5d944e57a02c83450849bf774 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
