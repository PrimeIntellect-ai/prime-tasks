[task]
name = "ibragim-badertdinov/yannickcr__eslint-plugin-react-82"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "yannickcr/eslint-plugin-react"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-react"
docker_image = "docker.io/swerebenchv2/yannickcr-eslint-plugin-react:82-598ab38@sha256:041e1d1262b8200599fd6cd5ac6cb400ef228654ff383a6753c85db441a9a861"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-react && git add -A && git diff --cached --binary 598ab384aa7b73d9da67d5c89ae3ac2878cca538 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
