[task]
name = "ibragim-badertdinov/nats-io__nsc-72"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "nats-io/nsc"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/nsc"
docker_image = "docker.io/swerebenchv2/nats-io-nsc:72-9e0bdc3@sha256:f13611707ff0c389bb2e08b1c7ebd28061b64acd4e34c654cdd6fa66a50c58c3"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /nsc && git add -A && git diff --cached --binary 9e0bdc32756cf93fac57bd7eeea618299ebbe64e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
