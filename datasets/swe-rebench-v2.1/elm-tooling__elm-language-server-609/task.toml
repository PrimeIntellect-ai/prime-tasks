[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /elm-language-server && git add -A && git diff --cached --binary f05d4c437762cbf35b1a62c53f02f39f437f0d1d > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
