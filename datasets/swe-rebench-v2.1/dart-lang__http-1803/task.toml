[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /http && git add -A && git diff --cached --binary 2c53fa3c558ec5d1dd9fce4360d435113dba11e5 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
