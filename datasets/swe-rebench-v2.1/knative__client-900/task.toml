[task]
name = "ibragim-badertdinov/knative__client-900"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "knative/client"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/client"
docker_image = "docker.io/swerebenchv2/knative-client:900-f82b323@sha256:b02dc55de448bd896eb41940dd1a10d0e1f8b7169974cb523e63fca173dd0263"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /client && git add -A && git diff --cached --binary f82b323a901cbcd9adc806d67fba9f5f96700a2f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
