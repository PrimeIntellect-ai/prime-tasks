[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /cloudpickle && git add -A && git diff --cached --binary 4e57a4520bdef785615a3f55875213823b59dcdd > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
