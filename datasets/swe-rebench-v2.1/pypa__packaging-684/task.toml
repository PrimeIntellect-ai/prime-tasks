[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /packaging && git add -A && git diff --cached --binary 63f4cfe679fb3d9322e56d8569207ecff4735238 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
