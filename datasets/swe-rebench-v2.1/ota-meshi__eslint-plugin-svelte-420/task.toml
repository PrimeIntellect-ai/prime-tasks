[task]
name = "ibragim-badertdinov/ota-meshi__eslint-plugin-svelte-420"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "ota-meshi/eslint-plugin-svelte"
language = "ts"
log_parser = "parse_log_js"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-svelte"
docker_image = "docker.io/swerebenchv2/ota-meshi-eslint-plugin-svelte:420-6d3e449@sha256:9f6c8ec66155bdab75e43e02bc40697fd15bfff65591c1e107fb499ecf9f2306"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-svelte && git add -A && git diff --cached --binary 6d3e449866bac0653859407d0025332849c02a43 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
