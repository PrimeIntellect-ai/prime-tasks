[task]
name = "ibragim-badertdinov/go-playground__validator-769"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "go-playground/validator"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/validator"
docker_image = "docker.io/swerebenchv2/go-playground-validator:769-d07eb88@sha256:81f03ee6edc1da3977d037143d0a472c16be887f2607b2c739460f4dbe121862"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /validator && git add -A && git diff --cached --binary d07eb88fb04047e450e834dd461210095fc28d6a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
