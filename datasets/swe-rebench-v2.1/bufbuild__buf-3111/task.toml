[task]
name = "ibragim-badertdinov/bufbuild__buf-3111"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "bufbuild/buf"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/buf"
docker_image = "docker.io/swerebenchv2/bufbuild-buf:3111-a3f9ce0@sha256:cad1a0b673b75ef77c9cf23081da0e9d6ff785cd7ef2396bce10046f61d7a009"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /buf && git add -A && git diff --cached --binary a3f9ce0024325bbbef4a63ee897b4a5cb4fbc480 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
