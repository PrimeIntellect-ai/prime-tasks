[task]
name = "ibragim-badertdinov/buchgr__bazel-remote-112"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "buchgr/bazel-remote"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/bazel-remote"
docker_image = "docker.io/swerebenchv2/buchgr-bazel-remote:112-2d12197@sha256:96bab93469c6ecf18ff7e6be34a48b81b5501eb85bfc23f30a59c83b63ebfce0"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /bazel-remote && git add -A && git diff --cached --binary 2d121977e14f90905c69f41fa37a59893d568b12 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
