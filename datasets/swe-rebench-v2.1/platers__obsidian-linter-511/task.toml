[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-linter && git add -A && git diff --cached --binary 951bfad86014463faa0c62ef935d2bc20d132583 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
