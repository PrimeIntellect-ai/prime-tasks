[task]
name = "ibragim-badertdinov/typescript-eslint__tslint-to-eslint-config-122"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "typescript-eslint/tslint-to-eslint-config"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/tslint-to-eslint-config"
docker_image = "docker.io/swerebenchv2/typescript-eslint-tslint-to-eslint-config:122-9f32f5a@sha256:0a3753d7bf0e61e0b6b68c298d3114a52d88e6ea484c26547a1161ffca7f8e53"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /tslint-to-eslint-config && git add -A && git diff --cached --binary 9f32f5a35eff0a020bb40d53774ff544f5e44d11 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
