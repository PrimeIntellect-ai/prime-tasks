[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/gitlab"
docker_image = "docker.io/swerebenchv2/semantic-release-gitlab:491-96bb3e9@sha256:879ad4621ca770a7d990e0990b272aa6729477085381e61f4b76bf275ae609ef"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /gitlab && git add -A && git diff --cached --binary 96bb3e94560164b40cf9f4a821c67cec0f9d8bfb > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
