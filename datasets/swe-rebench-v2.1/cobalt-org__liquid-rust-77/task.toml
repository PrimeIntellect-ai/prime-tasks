[task]
name = "ibragim-badertdinov/cobalt-org__liquid-rust-77"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "cobalt-org/liquid-rust"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/liquid-rust"
docker_image = "docker.io/swerebenchv2/cobalt-org-liquid-rust:77-323ecd6@sha256:e5d413b959c7709084452a88bad5864029f6c908de1e9fc3cd1fba763db000c3"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /liquid-rust && git add -A && git diff --cached --binary 323ecd666aa8f019ddaf7ebe044b82ea218769e7 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
