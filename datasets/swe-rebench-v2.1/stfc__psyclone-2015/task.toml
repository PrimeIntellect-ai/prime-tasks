[task]
name = "ibragim-badertdinov/stfc__psyclone-2015"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "stfc/PSyclone"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/PSyclone"
docker_image = "docker.io/swerebenchv2/stfc-psyclone:2015-01ca2f1@sha256:fd8938a94a343c8ddd9af8d6e9d637aef01fe86709f637e9841f816a3a0febe2"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /PSyclone && git add -A && git diff --cached --binary 01ca2f1b4db7bba99e15f00d534a013c6a656eec > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
