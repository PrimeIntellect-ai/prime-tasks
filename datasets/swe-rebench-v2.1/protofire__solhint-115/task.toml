[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /solhint && git add -A && git diff --cached --binary ca9d6e5b35af05ed5f00b0d5b484c7c40eaf2f5e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
