[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /WALinuxAgent && git add -A && git diff --cached --binary c6704cbad83b93763cf2403a77197559a67b9dca > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
