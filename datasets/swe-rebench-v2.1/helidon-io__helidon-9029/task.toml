[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /helidon && git add -A && git diff --cached --binary 7c40eb8f308456d9fa6f9545a10cebf15fc466f3 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
