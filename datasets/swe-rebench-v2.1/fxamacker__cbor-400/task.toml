[task]
name = "ibragim-badertdinov/fxamacker__cbor-400"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "fxamacker/cbor"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/cbor"
docker_image = "docker.io/swerebenchv2/fxamacker-cbor:400-6dfffb1@sha256:d80fc6e82d312bfdb762e2ea851d265a11b74d1b09106cbc74850c33f9be2199"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /cbor && git add -A && git diff --cached --binary 6dfffb1e174e3966a7296cddf19f7f7ef4eef1ef > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
