[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sushi && git add -A && git diff --cached --binary 19babfaf1c544c58bec9acb94d21a483f7106a39 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
