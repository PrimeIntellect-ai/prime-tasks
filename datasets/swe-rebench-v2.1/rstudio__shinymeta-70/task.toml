[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /shinymeta && git add -A && git diff --cached --binary bfa8fe6983385d50fd4553e3147f552ae5ab93b0 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
