[task]
name = "ibragim-badertdinov/rstudio__shinymeta-70"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "r"]
repo = "rstudio/shinymeta"
