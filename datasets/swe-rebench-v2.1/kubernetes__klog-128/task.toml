[task]
name = "ibragim-badertdinov/kubernetes__klog-128"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "kubernetes/klog"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/klog"
docker_image = "docker.io/swerebenchv2/kubernetes-klog:128-3c831a8@sha256:8256869a30a220801a8007263898299856f7c1c4e950848e8cd7c264192eb542"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /klog && git add -A && git diff --cached --binary 3c831a8853083f467dbfc00f0e342a5911cae540 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
