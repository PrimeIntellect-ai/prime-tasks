[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/pycodestyle"
docker_image = "docker.io/swerebenchv2/pycqa-pycodestyle:499-eae54ff@sha256:f8596a2a77a2d4c5f6db366f0a1dd1359f08ac558534dd4e3bb32c912b68dd11"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pycodestyle && git add -A && git diff --cached --binary eae54ff0e4c50ccc4507e95a2f8689fefb89e70e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
