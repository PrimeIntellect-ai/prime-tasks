[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sass-lint && git add -A && git diff --cached --binary d98602f524fb6bbb24b75ddc87bc3cbdc6a1f20a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
