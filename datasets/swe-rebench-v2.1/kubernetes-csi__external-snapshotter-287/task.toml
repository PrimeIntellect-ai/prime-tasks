[task]
name = "ibragim-badertdinov/kubernetes-csi__external-snapshotter-287"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "kubernetes-csi/external-snapshotter"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/external-snapshotter"
docker_image = "docker.io/swerebenchv2/kubernetes-csi-external-snapshotter:287-0a9f3c2@sha256:65941fd961ec755413953334ef7227442658f143dc699b900d58086c1a811ced"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /external-snapshotter && git add -A && git diff --cached --binary 0a9f3c218198b47d7d8fe76ad3e04eb756dce05c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
