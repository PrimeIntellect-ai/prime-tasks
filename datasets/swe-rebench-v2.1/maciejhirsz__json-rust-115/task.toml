[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /json-rust && git add -A && git diff --cached --binary 7497c5ab588de055bb19c6586165afc8f807e940 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
