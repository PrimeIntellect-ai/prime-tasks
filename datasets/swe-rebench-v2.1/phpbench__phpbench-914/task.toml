[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /phpbench && git add -A && git diff --cached --binary e087dfdfc8be2a5010fbda3bb34195a1f2cdecf8 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
