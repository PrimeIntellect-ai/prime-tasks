[task]
name = "ibragim-badertdinov/networknt__json-schema-validator-533"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "java"]
repo = "networknt/json-schema-validator"
language = "java"
log_parser = "parse_java_mvn"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/json-schema-validator"
docker_image = "docker.io/swerebenchv2/networknt-json-schema-validator:533-1b43f0d@sha256:a382b15b478e6c8e4408de3527bfbfc3200acc7c2a58ac0bcf497a728ff62a78"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /json-schema-validator && git add -A && git diff --cached --binary 1b43f0d533b6c18b0d48a6b8f9eee6a2c2fb849f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
