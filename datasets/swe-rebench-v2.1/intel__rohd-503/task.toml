[task]
name = "ibragim-badertdinov/intel__rohd-503"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "dart"]
repo = "intel/rohd"
language = "dart"
log_parser = "parse_log_dart"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rohd"
docker_image = "docker.io/swerebenchv2/intel-rohd@sha256:3671ed400f60bcbb071b57640e39c772c3ebc62c1ccdfe3aa8ff92bbb3058ad3"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rohd && git add -A && git diff --cached --binary 64741342fed93d5d9e8902eb101dfeb2adfd5f5d > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
