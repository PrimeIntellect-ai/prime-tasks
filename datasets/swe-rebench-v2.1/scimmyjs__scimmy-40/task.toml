[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /scimmy && git add -A && git diff --cached --binary cd8cc5c546fb458c58cb31cfd2c7ab004dbf9f30 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
