[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /go-gitdiff && git add -A && git diff --cached --binary 3f2ea5c16e0a9d685e1b91b6b8bfc0fbf4cb5d6a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
