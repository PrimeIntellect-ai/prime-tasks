[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /bazelisk && git add -A && git diff --cached --binary dba981e4e82bec8e0de5a6587913e3341ed10081 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
