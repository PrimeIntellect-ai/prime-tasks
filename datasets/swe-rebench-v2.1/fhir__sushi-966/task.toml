[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sushi && git add -A && git diff --cached --binary fb5a20ba3ecf2bc1a6a73939a392adbbf01ebc68 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
