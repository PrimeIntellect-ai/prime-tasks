[task]
name = "ibragim-badertdinov/sharkdp__numbat-461"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "sharkdp/numbat"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/numbat"
docker_image = "docker.io/swerebenchv2/sharkdp-numbat:461-0e098cd@sha256:c535c2decb4699c164b67115eec2af4983de0b3a2fb2b89cb8050a084d17ad43"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /numbat && git add -A && git diff --cached --binary 0e098cde69cc4511d44cb1ed703ec05d1c519394 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
