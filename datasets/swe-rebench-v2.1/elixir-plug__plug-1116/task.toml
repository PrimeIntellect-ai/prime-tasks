[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/plug"
docker_image = "docker.io/swerebenchv2/elixir-plug-plug:1116-3a9b7c5@sha256:01211f04b13cdb4a0af618052f7e39b023708735ef5afa830f33d3077addfcbf"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /plug && git add -A && git diff --cached --binary 3a9b7c5c5a4bb986599a9f75b654fd2fa5ba7b14 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
