[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-linter && git add -A && git diff --cached --binary bea8b5593a85bd8e9c7ce9cc8a711f5059b2e0f4 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
