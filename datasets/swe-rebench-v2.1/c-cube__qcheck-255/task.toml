[task]
name = "ibragim-badertdinov/c-cube__qcheck-255"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ocaml"]
repo = "c-cube/qcheck"
language = "ocaml"
log_parser = "parse_log_ocaml"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/qcheck"
docker_image = "docker.io/swerebenchv2/c-cube-qcheck:255-0ad4e0a@sha256:a661c5afe1e9d9d163a640be5f6d286b786b356901f7cdf9ae6184e64abb4f47"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /qcheck && git add -A && git diff --cached --binary 0ad4e0a8994c7198aa941b2b47ab2e333ca62778 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
