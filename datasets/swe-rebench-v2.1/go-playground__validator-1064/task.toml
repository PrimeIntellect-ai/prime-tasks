[task]
name = "ibragim-badertdinov/go-playground__validator-1064"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "go-playground/validator"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/validator"
docker_image = "docker.io/swerebenchv2/go-playground-validator:1064-8f07b03@sha256:8fabd10abe6e47eb159052506cb57bfb5d8e4ae6cf9ec0188db08255ef9f3c62"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /validator && git add -A && git diff --cached --binary 8f07b0368280d9fc70b4ffd3708b31427bbc286d > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
