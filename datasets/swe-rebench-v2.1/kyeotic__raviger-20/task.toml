[task]
name = "ibragim-badertdinov/kyeotic__raviger-20"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "kyeotic/raviger"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/raviger"
docker_image = "docker.io/swerebenchv2/kyeotic-raviger:20-0360ceb@sha256:5cde62d3c7a26cbb3b79efee89c47b4ae002e7fddfe8e2aa7fb610bded85752e"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /raviger && git add -A && git diff --cached --binary 0360ceb5c029c36981c4ba47ea3e6576d554582e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
