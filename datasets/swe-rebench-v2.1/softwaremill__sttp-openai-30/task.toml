[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/sttp-openai"
docker_image = "docker.io/swerebenchv2/softwaremill-sttp-openai:30-818a6b9@sha256:5b145cc653d553929788ba5a776fb66ef485257dfc753bbaad63e8be04c4d47b"
env = { _JAVA_OPTIONS = "" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sttp-openai && git add -A && git diff --cached --binary 818a6b975aa244fb5af44a546dfea7d30c220811 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
