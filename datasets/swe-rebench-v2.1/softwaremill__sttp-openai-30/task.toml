[task]
name = "ibragim-badertdinov/softwaremill__sttp-openai-30"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "scala"]
repo = "softwaremill/sttp-openai"
language = "scala"
log_parser = "parse_log_scala_v3"
quality_flags = []

[verifier]
environment_mode = "separate"
