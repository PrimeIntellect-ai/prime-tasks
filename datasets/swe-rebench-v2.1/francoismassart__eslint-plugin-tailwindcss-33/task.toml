[task]
name = "ibragim-badertdinov/francoismassart__eslint-plugin-tailwindcss-33"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "francoismassart/eslint-plugin-tailwindcss"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-tailwindcss"
docker_image = "docker.io/swerebenchv2/francoismassart-eslint-plugin-tailwindcss:33-b8a9c2a@sha256:793abc3d4e0e9a2a056842fc48f3532357be671985a8a32ff57fc2ebf7138365"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-tailwindcss && git add -A && git diff --cached --binary b8a9c2a6c6b4d965715e5e717824532aae33d7bd > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
