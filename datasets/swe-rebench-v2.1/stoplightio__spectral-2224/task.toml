[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /spectral && git add -A && git diff --cached --binary 6e94cfa9594c8e108def6c37096bb5bc2fe3afda > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
