[task]
name = "ibragim-badertdinov/pypa__packaging-165"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "pypa/packaging"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/packaging"
docker_image = "docker.io/swerebenchv2/pypa-packaging:165-5ef37d3@sha256:0d91fc0b7c1df5b073fa3166dc0901e25113e805a44bd0b2602d4f4374b48cd7"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /packaging && git add -A && git diff --cached --binary 5ef37d364bfb18461da28fd667e4d538ba67255b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
