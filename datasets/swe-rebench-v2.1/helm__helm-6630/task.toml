[task]
name = "ibragim-badertdinov/helm__helm-6630"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "helm/helm"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/helm"
docker_image = "docker.io/swerebenchv2/helm-helm:6630-1da0d01@sha256:57f5f025ae8a71a163a0bad52a214e8759468dcb319dbb266ad625d3881062c3"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /helm && git add -A && git diff --cached --binary 1da0d011f9883ef3ac492c1b4cd5dc6d8c19d1aa > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
