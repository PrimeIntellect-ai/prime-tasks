[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /router && git add -A && git diff --cached --binary 6ae3c7016a180ec7684b2f03311a09a0f2e60164 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
