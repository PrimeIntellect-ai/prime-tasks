[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-linter && git add -A && git diff --cached --binary c1e727761f7907c72832d42c3b45b183852c3fb1 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
