[task]
name = "ibragim-badertdinov/geoswift__geoswift-235"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "swift"]
repo = "GEOSwift/GEOSwift"
language = "swift"
log_parser = "parse_log_swift"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/GEOSwift"
docker_image = "docker.io/swerebenchv2/geoswift-geoswift:235-1a39a5a@sha256:5c2c149a4337dac4533e0020571f6b0350273bbe39303b7aa6bc2e89f123f054"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /GEOSwift && git add -A && git diff --cached --binary 1a39a5ae385fd6d7ddd3286d464cb357c6f14e5e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
