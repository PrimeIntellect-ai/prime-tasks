[task]
name = "ibragim-badertdinov/borchero__switchboard-35"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "borchero/switchboard"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/switchboard"
docker_image = "docker.io/swerebenchv2/borchero-switchboard:35-3cf0c30@sha256:5c68ccef7b3373d715fd572231a92edb7e7026a7d317e1adcc69885de89f3dd2"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /switchboard && git add -A && git diff --cached --binary 3cf0c302fc015436e3c5432d31c5096f22fc38f3 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
