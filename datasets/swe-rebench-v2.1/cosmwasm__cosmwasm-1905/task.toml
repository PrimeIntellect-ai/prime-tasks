[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /cosmwasm && git add -A && git diff --cached --binary 31c8b9f10e3efb961490eb97d96849d24e7a285d > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
