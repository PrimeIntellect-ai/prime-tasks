[task]
name = "ibragim-badertdinov/vuejs__eslint-plugin-vue-1790"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "vuejs/eslint-plugin-vue"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-vue"
docker_image = "docker.io/swerebenchv2/vuejs-eslint-plugin-vue:1790-d6f0337@sha256:67e217e018e1b84e4f1100c45619b9d803fdfed56b54a17504009ab6307e8387"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-vue && git add -A && git diff --cached --binary d6f0337d88ce39214f4bf2853a5cdc26e2c30e32 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
