[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/validator"
docker_image = "docker.io/swerebenchv2/go-playground-validator:1214-98aa9f2@sha256:96b814ba4052faf99805f80da0181f94977c7981a1f14ad36c6379a16c29361d"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /validator && git add -A && git diff --cached --binary 98aa9f2068453704a3d3c9daf94172bbf62ffbae > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
