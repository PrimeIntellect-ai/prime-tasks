[task]
name = "ibragim-badertdinov/helidon-io__helidon-8859"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "java"]
repo = "helidon-io/helidon"
language = "java"
log_parser = "parse_java_mvn"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/helidon"
docker_image = "docker.io/swerebenchv2/helidon-io-helidon:8859-2b87b33@sha256:b1076883003425418b24f4f07c61cad07b525ba68aad82239b5c497464ac8aea"
env = { _JAVA_OPTIONS = "" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /helidon && git add -A && git diff --cached --binary 2b87b335e846f7d6ba38c6ab2d2042c015fb21ee > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
