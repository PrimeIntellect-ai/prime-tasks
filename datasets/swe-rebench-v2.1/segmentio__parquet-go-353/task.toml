[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /parquet-go && git add -A && git diff --cached --binary dd8318a577a976ef977b9796b10a6c07c61c6bf5 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
