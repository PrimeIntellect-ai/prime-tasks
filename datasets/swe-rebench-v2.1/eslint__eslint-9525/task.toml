[task]
name = "ibragim-badertdinov/eslint__eslint-9525"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "eslint/eslint"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint"
docker_image = "docker.io/swerebenchv2/eslint-eslint:9525-b8aa071@sha256:fa67e519397d01351527823b0031ca588dd6eac4dbf905a5f58fefc7a0dd564d"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint && git add -A && git diff --cached --binary b8aa0718c88774f7ef59b5b1ca22e1478a09b1e6 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
