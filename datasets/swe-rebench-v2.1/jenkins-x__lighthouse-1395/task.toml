[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /lighthouse && git add -A && git diff --cached --binary f68e049c4cca44724d384c6480b1dd4ae3406adb > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
