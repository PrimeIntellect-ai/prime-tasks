[task]
name = "ibragim-badertdinov/superlistapp__super_editor-1384"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "dart"]
repo = "superlistapp/super_editor"
language = "dart"
log_parser = "parse_log_dart"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/super_editor"
docker_image = "docker.io/swerebenchv2/superlistapp-super-editor@sha256:929ce043c1a8bff4fa038f6a2ee4b93c2df5502c3b1097c2ff747f914389371f"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /super_editor && git add -A && git diff --cached --binary 5b2de6d5074b7fe4518bc5a290d7eb8c920adee8 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
