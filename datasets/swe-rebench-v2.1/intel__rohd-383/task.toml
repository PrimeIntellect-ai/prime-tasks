[task]
name = "ibragim-badertdinov/intel__rohd-383"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "dart"]
repo = "intel/rohd"
language = "dart"
log_parser = "parse_log_dart"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rohd"
docker_image = "docker.io/swerebenchv2/intel-rohd@sha256:9a9af5567290dff6091205f3e2f293b372a8eb86a88c2ea7066767100bcf07d7"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rohd && git add -A && git diff --cached --binary 502b5432b093d625bffe23b5fb177175f0dfdb02 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
