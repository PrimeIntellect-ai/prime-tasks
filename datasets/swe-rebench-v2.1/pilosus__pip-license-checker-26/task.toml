[task]
name = "ibragim-badertdinov/pilosus__pip-license-checker-26"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "clojure"]
repo = "pilosus/pip-license-checker"
language = "clojure"
log_parser = "parse_log_lein"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/pip-license-checker"
docker_image = "docker.io/swerebenchv2/pilosus-pip-license-checker:26-86c653d@sha256:6cbca2d68530467567565442a9f00bde8b98a6d340db650257383faf08a09608"
env = { JAVA_TOOL_OPTIONS = "-Dfile.encoding=UTF-8" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pip-license-checker && git add -A && git diff --cached --binary 86c653d331dbfaaaf1c7e9e01bf67f25d22f40d8 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
