[task]
name = "ibragim-badertdinov/eslint__eslint-9632"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "eslint/eslint"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint"
docker_image = "docker.io/swerebenchv2/eslint-eslint:9632-0cf081e@sha256:5d2a527a3103e2c83554953ae9003dce3b1e4883a6c5bd800ad4a1a2dfc58ad0"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint && git add -A && git diff --cached --binary 0cf081ef7249c8e3b9e2cba4710f6205ef996b02 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
