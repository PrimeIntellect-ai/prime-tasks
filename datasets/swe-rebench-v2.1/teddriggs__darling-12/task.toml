[task]
name = "ibragim-badertdinov/teddriggs__darling-12"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "TedDriggs/darling"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/darling"
docker_image = "docker.io/swerebenchv2/teddriggs-darling:12-6cd46b6@sha256:35dfe5fd6e82cca37a49b732eb4ae5df4a9a057ba07f1f1930c94c9ac2001524"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /darling && git add -A && git diff --cached --binary 6cd46b63335d1de4a3a877aebbc32023118cd145 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
