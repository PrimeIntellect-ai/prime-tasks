[task]
name = "ibragim-badertdinov/intel__rohd-190"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "dart"]
repo = "intel/rohd"
language = "dart"
log_parser = "parse_log_dart"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rohd"
docker_image = "docker.io/swerebenchv2/intel-rohd@sha256:9c86bfd43c8c8b42ce88c543d1c4b00532e374dee13b0d27782f72c17dfa9d1d"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rohd && git add -A && git diff --cached --binary 10f03e3cd933af499775bb133ca66b25a6af2aff > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
