docker_image = "docker.io/swerebenchv2/eslint-eslint:8413-936af66@sha256:f394e8e6fee93f1936f976dac2c4fc8acf326658bf421d6d90cc77504bdde4a1"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint && git add -A && git diff --cached --binary 936af661199e51664d5ac28dd4af5cfe1b0e20c1 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
