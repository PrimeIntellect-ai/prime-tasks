[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/poolex"
docker_image = "docker.io/swerebenchv2/general-cbic-poolex:144-0caf3be@sha256:b3be8df512f728dbac090b2bf9d60ff935eff10844946ee9b427ae6f6dd52b6a"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /poolex && git add -A && git diff --cached --binary 0caf3be9866af85e02e3aea9ef27e974f58537af > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
