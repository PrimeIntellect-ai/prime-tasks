[task]
name = "ibragim-badertdinov/general-cbic__poolex-144"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "elixir"]
repo = "general-CbIC/poolex"
language = "elixir"
log_parser = "parse_log_elixir"
quality_flags = []

[verifier]
environment_mode = "separate"
