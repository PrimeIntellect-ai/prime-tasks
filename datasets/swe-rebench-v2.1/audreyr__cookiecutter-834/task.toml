[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /cookiecutter && git add -A && git diff --cached --binary ceafa1dc1b5eb70835ffba5dc7457df269d77ba8 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
