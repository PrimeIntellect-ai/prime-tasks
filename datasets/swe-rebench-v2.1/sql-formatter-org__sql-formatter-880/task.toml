[task]
name = "ibragim-badertdinov/sql-formatter-org__sql-formatter-880"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "sql-formatter-org/sql-formatter"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/sql-formatter"
docker_image = "docker.io/swerebenchv2/sql-formatter-org-sql-formatter:880-efee49f@sha256:d91da4007d2601d3d890eb035a88e894a39fc02f0fac44a14de06bde2e6a33cb"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sql-formatter && git add -A && git diff --cached --binary efee49f91f76e5d2ea356e628e959ac8cf0a7ddd > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
