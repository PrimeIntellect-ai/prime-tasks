[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /xgcm && git add -A && git diff --cached --binary 2780d1ff0facc43138a77f0960d2fbf35c7c7341 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
