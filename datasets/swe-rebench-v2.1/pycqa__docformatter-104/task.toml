[task]
name = "ibragim-badertdinov/pycqa__docformatter-104"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "PyCQA/docformatter"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/docformatter"
docker_image = "docker.io/swerebenchv2/pycqa-docformatter:104-b108a20@sha256:47d2d1740f6fa95ace58514df4bc71272421a2459164c74ccebf35f6823bd2fc"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /docformatter && git add -A && git diff --cached --binary b108a208536f94da786211a28ea3bda4f55a04a4 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
