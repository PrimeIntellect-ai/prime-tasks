[task]
name = "ibragim-badertdinov/twisted__pydoctor-191"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "twisted/pydoctor"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/pydoctor"
docker_image = "docker.io/swerebenchv2/twisted-pydoctor:191-f26e7be@sha256:d3d510c1812db4b33515ceafbf6bd56504eed8ad90e7d45187fae3fb672a4f5e"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pydoctor && git add -A && git diff --cached --binary f26e7be043bab85d47116289c280d49b371451ac > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
