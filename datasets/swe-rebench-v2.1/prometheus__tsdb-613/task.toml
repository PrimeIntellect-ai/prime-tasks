[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /tsdb && git add -A && git diff --cached --binary 13c80a5979c18b06243f6b388c4787a3d2060111 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
