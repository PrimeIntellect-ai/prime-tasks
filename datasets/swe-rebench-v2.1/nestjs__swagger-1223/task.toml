[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /swagger && git add -A && git diff --cached --binary acde5d6a88c3472ed4236a4ffcf35b71709120e0 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
