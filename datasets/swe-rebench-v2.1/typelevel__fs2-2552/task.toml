[task]
name = "ibragim-badertdinov/typelevel__fs2-2552"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "scala"]
repo = "typelevel/fs2"
language = "scala"
log_parser = "parse_log_scala_v2"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/fs2"
docker_image = "docker.io/swerebenchv2/typelevel-fs2@sha256:420e811dc49946d01877705223fb25687709cc8d6ca02ddca5f3582d227879e5"
env = { _JAVA_OPTIONS = "" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /fs2 && git add -A && git diff --cached --binary 1a7ce3efeb0783f146527503e6cf672ad286c31a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
