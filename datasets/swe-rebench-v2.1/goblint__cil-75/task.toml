[task]
name = "ibragim-badertdinov/goblint__cil-75"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ocaml"]
repo = "goblint/cil"
language = "ocaml"
log_parser = "parse_log_ocaml_v2"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/cil"
docker_image = "docker.io/swerebenchv2/goblint-cil:75-5bc7361@sha256:db058dfcca50268e9caf7fa93b644c4f90deae19b24bbe0ea54902c407ebc8b0"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /cil && git add -A && git diff --cached --binary 5bc7361d2a4244062039f4b52618f07b88c4632f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
