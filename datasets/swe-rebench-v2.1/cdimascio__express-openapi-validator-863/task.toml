[task]
name = "ibragim-badertdinov/cdimascio__express-openapi-validator-863"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "cdimascio/express-openapi-validator"
language = "ts"
log_parser = "parse_log_js"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/express-openapi-validator"
docker_image = "docker.io/swerebenchv2/cdimascio-express-openapi-validator:863-807e09c@sha256:860d17b49767e62b2f2b2ac390aeb36981780e07deaa2c8794e41747f7715405"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /express-openapi-validator && git add -A && git diff --cached --binary 807e09c9cf2f1f1daec7521fec07b23c981eb3c4 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
