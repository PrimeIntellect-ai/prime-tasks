[task]
name = "ibragim-badertdinov/yogthos__migratus-231"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "clojure"]
repo = "yogthos/migratus"
language = "clojure"
log_parser = "parse_log_lein"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/migratus"
docker_image = "docker.io/swerebenchv2/yogthos-migratus:231-fbb2704@sha256:b90af3e8605f1ed32b576754f55706aac529b6c0e61808db6ad681d29dab200b"
env = { JAVA_TOOL_OPTIONS = "-Dfile.encoding=UTF-8" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /migratus && git add -A && git diff --cached --binary fbb27047b0bae88af406e6c5a5eca565d653652b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
