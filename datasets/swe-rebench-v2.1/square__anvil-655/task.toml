[task]
name = "ibragim-badertdinov/square__anvil-655"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "kotlin"]
repo = "square/anvil"
language = "kotlin"
log_parser = "parse_log_gradlew_v1"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/anvil"
docker_image = "docker.io/swerebenchv2/square-anvil:655-30a8c33@sha256:f25d51ccad8e1da826861a7317b60b371abd3fee3c191b5473a624c7b697bcc1"
env = { _JAVA_OPTIONS = "" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /anvil && git add -A && git diff --cached --binary 30a8c3317215a5b6525e9c514f5bc4f86d90629b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
