[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/synthetics"
docker_image = "docker.io/swerebenchv2/elastic-synthetics:321-7902aff@sha256:2268b3048b587588fea99a03549d55e080aed8f784e1517dd1f7c72673d18e9e"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /synthetics && git add -A && git diff --cached --binary 7902aff134b58a9c39a4c0a309608a087fb27b5c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
