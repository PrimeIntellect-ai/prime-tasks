[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /multi-gitter && git add -A && git diff --cached --binary 28f6a82be47bb286395078c28b626cb783cb9a93 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
