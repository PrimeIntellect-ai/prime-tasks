[task]
name = "ibragim-badertdinov/pycqa__docformatter-177"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "PyCQA/docformatter"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/docformatter"
docker_image = "docker.io/swerebenchv2/pycqa-docformatter:177-570825a@sha256:420783ef16cc425e9891c369a59c7be4d4110dd325e29021317b4eb797528da5"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /docformatter && git add -A && git diff --cached --binary 570825a5913a0d4e7da9b54a3bf3680e7e3b52eb > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
