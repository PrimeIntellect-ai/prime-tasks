[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /yapf && git add -A && git diff --cached --binary bc2437b2a3fa818d34f6db994ee0cd4386c7985c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
