[task]
name = "ibragim-badertdinov/maciejhirsz__json-rust-26"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "maciejhirsz/json-rust"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/json-rust"
docker_image = "docker.io/swerebenchv2/maciejhirsz-json-rust:26-604effa@sha256:8a7cea2f95d2121c91e26d2aecc4681414d5efcada21f633ab745f1127e1bfc0"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /json-rust && git add -A && git diff --cached --binary 604effa376b825b110b2a4b64283c0891dba8cd5 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
