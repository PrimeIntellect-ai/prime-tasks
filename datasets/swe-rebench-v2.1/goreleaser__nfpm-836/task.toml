[task]
name = "ibragim-badertdinov/goreleaser__nfpm-836"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "goreleaser/nfpm"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/nfpm"
docker_image = "docker.io/swerebenchv2/goreleaser-nfpm:836-41b3349@sha256:a9b52e1b2daca3225fdf9bb0a42849f872b81625e8e03101d4c774afb0287512"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /nfpm && git add -A && git diff --cached --binary 41b334968e3a8c80d094d77a70a209ac6294e992 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
