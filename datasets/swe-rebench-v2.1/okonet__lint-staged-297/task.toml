[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /lint-staged && git add -A && git diff --cached --binary 1dc3bd60f301f52cb2e96f441338837ae363131e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
