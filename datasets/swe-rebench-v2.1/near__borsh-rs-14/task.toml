[task]
name = "ibragim-badertdinov/near__borsh-rs-14"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "near/borsh-rs"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/borsh-rs"
docker_image = "docker.io/swerebenchv2/near-borsh-rs:14-c62cdfb@sha256:375a4eace03a480a5fa4fb1c9d22f2548abd4a43f0e3408c9a36a3ffbe624bfe"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /borsh-rs && git add -A && git diff --cached --binary c62cdfbd10d4a17fc877809eba4ccb65e866d5f8 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
