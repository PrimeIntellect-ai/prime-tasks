[task]
name = "ibragim-badertdinov/lindell__multi-gitter-222"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "lindell/multi-gitter"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/multi-gitter"
docker_image = "docker.io/swerebenchv2/lindell-multi-gitter:222-ea97fa2@sha256:51664c12cc615533360bc5ddc30e151cd6c35d9e9eb673d8a23330544be8a01d"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /multi-gitter && git add -A && git diff --cached --binary ea97fa2010378b353c0a43f832aced2054ae182d > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
