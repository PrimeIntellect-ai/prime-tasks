[task]
name = "ibragim-badertdinov/googlefonts__glyphslib-563"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "googlefonts/glyphsLib"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/glyphsLib"
docker_image = "docker.io/swerebenchv2/googlefonts-glyphslib:563-5bb9840@sha256:bf11e4943e2592784583c5f2a97782c5367045ba88e8312e4c2fb29af3d24e7d"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /glyphsLib && git add -A && git diff --cached --binary 5bb9840f2203c0e289b54369b26963cc039a73fb > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
