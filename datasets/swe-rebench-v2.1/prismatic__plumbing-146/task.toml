[task]
name = "ibragim-badertdinov/prismatic__plumbing-146"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "clojure"]
repo = "Prismatic/plumbing"
language = "clojure"
log_parser = "parse_log_lein"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/plumbing"
docker_image = "docker.io/swerebenchv2/prismatic-plumbing:146-df7218c@sha256:5f4289188b0e0d630911a65bc21916f121b91bba7715c94321b39a2dd5ea4c87"
env = { JAVA_TOOL_OPTIONS = "-Dfile.encoding=UTF-8" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /plumbing && git add -A && git diff --cached --binary df7218c5056c1438a53811e71855af2aa805e589 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
