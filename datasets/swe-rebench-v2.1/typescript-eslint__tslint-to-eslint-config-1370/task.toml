[task]
name = "ibragim-badertdinov/typescript-eslint__tslint-to-eslint-config-1370"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "typescript-eslint/tslint-to-eslint-config"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/tslint-to-eslint-config"
docker_image = "docker.io/swerebenchv2/typescript-eslint-tslint-to-eslint-config:1370-6f393cd@sha256:36ff46c7878f4d2dd61defd97b37a5d7ab0360be129e4e6a05b12ae8d07c6a52"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /tslint-to-eslint-config && git add -A && git diff --cached --binary 6f393cdb296d8649bbe51746012afb04c303422c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
