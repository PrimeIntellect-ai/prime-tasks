[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /fika && git add -A && git diff --cached --binary 1c998a264babc348d0201a85d1da0f4718bbb6da > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
