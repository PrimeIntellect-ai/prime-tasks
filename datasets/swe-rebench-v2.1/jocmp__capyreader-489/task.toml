[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/capyreader"
docker_image = "docker.io/swerebenchv2/jocmp-capyreader:489-cbcecc4@sha256:bad1b63771c8d9d34821739aec583e1e0dcbdb4a76cfd3695de98322e713788e"
env = { _JAVA_OPTIONS = "" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /capyreader && git add -A && git diff --cached --binary cbcecc4291a68c9e4e6bc22b8a587028871efede > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
