[task]
name = "ibragim-badertdinov/sasstools__sass-lint-99"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "sasstools/sass-lint"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/sass-lint"
docker_image = "docker.io/swerebenchv2/sasstools-sass-lint:99-0846faa@sha256:9bc9a23cd1a3753349676d2bc6bb67ae3e17c886ee955fbea3cf96f4f5baabd9"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sass-lint && git add -A && git diff --cached --binary 0846faa33df66474d0a2db2fcb51eaeaa19db176 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
