[task]
name = "ibragim-badertdinov/playwright-community__eslint-plugin-playwright-264"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "playwright-community/eslint-plugin-playwright"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-playwright"
docker_image = "docker.io/swerebenchv2/playwright-community-eslint-plugin-playwright:264-95fcfd8@sha256:4109113285e1fde2224a9015c9c57f0d58d92a4c63e0ceac865f201f151a932e"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-playwright && git add -A && git diff --cached --binary 95fcfd8f7b65acd0d799da5b43255945c97c37e7 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
