[task]
name = "ibragim-badertdinov/onflow__flow-cli-350"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "onflow/flow-cli"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/flow-cli"
docker_image = "docker.io/swerebenchv2/onflow-flow-cli:350-54d65b0@sha256:e1cc355816535e42212f370bbd2f78ed63f549e72f1bf1f57dd26e7c581a6018"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /flow-cli && git add -A && git diff --cached --binary 54d65b017d42c1fb2943d6896dd7a195d325edde > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
