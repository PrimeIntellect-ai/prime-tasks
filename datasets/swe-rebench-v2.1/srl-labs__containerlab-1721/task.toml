[task]
name = "ibragim-badertdinov/srl-labs__containerlab-1721"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "srl-labs/containerlab"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/containerlab"
docker_image = "docker.io/swerebenchv2/srl-labs-containerlab:1721-3b3cbef@sha256:782a8e97c1fcc39300269af4fb9205ae5e99eb0740d0b3ef6c4d4369e3ffca52"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /containerlab && git add -A && git diff --cached --binary 3b3cbefa11ad75d78016dc439575350a05c8a1ed > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
