[task]
name = "ibragim-badertdinov/prettier__plugin-pug-502"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "prettier/plugin-pug"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/plugin-pug"
docker_image = "docker.io/swerebenchv2/prettier-plugin-pug:502-d9a44b1@sha256:c269e2698ea3699f214fc3b5de14aeaccf90c34b1da96e1c9a1e3528af781cb9"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /plugin-pug && git add -A && git diff --cached --binary d9a44b18a683333ea6abb518dfed9d595b3bece6 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
