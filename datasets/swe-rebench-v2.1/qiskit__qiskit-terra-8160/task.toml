[task]
name = "ibragim-badertdinov/qiskit__qiskit-terra-8160"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "Qiskit/qiskit-terra"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/qiskit-terra"
docker_image = "docker.io/swerebenchv2/qiskit-qiskit-terra:8160-b8ea2b0@sha256:6805a3bd84bd11ce269c1696b24647441b26e0f5ccd64abd4392e0dcab681500"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /qiskit-terra && git add -A && git diff --cached --binary b8ea2b0bc9cf25ff8bf88c476831843a4f6ffb98 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
