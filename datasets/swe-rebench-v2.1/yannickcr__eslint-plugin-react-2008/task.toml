[task]
name = "ibragim-badertdinov/yannickcr__eslint-plugin-react-2008"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "yannickcr/eslint-plugin-react"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-react"
docker_image = "docker.io/swerebenchv2/yannickcr-eslint-plugin-react:2008-c2ae5d3@sha256:6fc8d7b8e9f15b859502f021ef565f73317d8b2eaef46e02b5575f99a28aebe7"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-react && git add -A && git diff --cached --binary c2ae5d39ffaef41806a9562d20e549cb7b09057a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
