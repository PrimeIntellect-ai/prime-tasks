[task]
name = "ibragim-badertdinov/semantic-release__gitlab-498"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "semantic-release/gitlab"
language = "js"
log_parser = "parse_log_js"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/gitlab"
docker_image = "docker.io/swerebenchv2/semantic-release-gitlab:498-b2dab9b@sha256:37adf63a0f86603e16cdab9dc7e2ee594194b06ea12638636a1f62ab8a4b8c6a"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /gitlab && git add -A && git diff --cached --binary b2dab9b7ea8d40951e1e7271d8c92170df350876 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
