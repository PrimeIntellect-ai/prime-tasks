[task]
name = "ibragim-badertdinov/goreleaser__nfpm-808"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "goreleaser/nfpm"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/nfpm"
docker_image = "docker.io/swerebenchv2/goreleaser-nfpm:808-1667ef9@sha256:bdf56340ed8405413c84076c65b2ec616adfbfc367fc70d51033aecac2120539"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /nfpm && git add -A && git diff --cached --binary 1667ef9585c38d8e61ac99875211416e7d1f60de > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
