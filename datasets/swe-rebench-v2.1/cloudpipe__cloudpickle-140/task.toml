[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /cloudpickle && git add -A && git diff --cached --binary abeb3fbe9645f726be5bd745434e8fdd0a0c1684 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
