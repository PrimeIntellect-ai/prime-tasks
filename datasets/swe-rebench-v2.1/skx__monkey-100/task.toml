[task]
name = "ibragim-badertdinov/skx__monkey-100"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "skx/monkey"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/monkey"
docker_image = "docker.io/swerebenchv2/skx-monkey:100-2aa97a9@sha256:27f4e262208c1d30be49f73d0c1c7c96d842df2f4974f3f324901c946a594eeb"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /monkey && git add -A && git diff --cached --binary 2aa97a9d828e8bb9aa3a558dfa90a1608181806d > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
