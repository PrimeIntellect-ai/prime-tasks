[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rustfmt"
docker_image = "docker.io/swerebenchv2/rust-lang-rustfmt:5845-b069aac@sha256:d74c796543d38fd8c7eaaf9179beb60f4358f95ec636c6f2b9665e7c2f3e0db1"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rustfmt && git add -A && git diff --cached --binary b069aac44ddfdb70d55d9ae40695be44515e5bb0 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
