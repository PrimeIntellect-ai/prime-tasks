[task]
name = "ibragim-badertdinov/pycqa__docformatter-148"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "PyCQA/docformatter"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/docformatter"
docker_image = "docker.io/swerebenchv2/pycqa-docformatter:148-518018f@sha256:20f7240ffdce7d98b4045452326684704e5deef18a73db5ac787870a10d9225b"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /docformatter && git add -A && git diff --cached --binary 518018f7da0875a8f2d9df3f1c822889efb7c67e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
