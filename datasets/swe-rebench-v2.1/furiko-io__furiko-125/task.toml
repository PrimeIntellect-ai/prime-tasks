[task]
name = "ibragim-badertdinov/furiko-io__furiko-125"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "furiko-io/furiko"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/furiko"
docker_image = "docker.io/swerebenchv2/furiko-io-furiko:125-2a58bbc@sha256:f6c90fb80ebeca5bd50b4cfae018b9601ccec602b7b42b6f95a52e71315c92fb"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /furiko && git add -A && git diff --cached --binary 2a58bbc1006bcbdf4daeb90fe31fe67e558024a3 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
