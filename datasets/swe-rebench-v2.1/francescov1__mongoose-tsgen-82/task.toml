[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /mongoose-tsgen && git add -A && git diff --cached --binary b1d9eb5f9958f90c18a81607780660d8caface5a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
