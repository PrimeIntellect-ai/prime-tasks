[task]
name = "ibragim-badertdinov/googleapis__api-linter-560"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "googleapis/api-linter"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/api-linter"
docker_image = "docker.io/swerebenchv2/googleapis-api-linter:560-05f3499@sha256:6e25581a25509b7df75f50bd124039b9dab65fb6edc9049ec9205c61e4b73ec2"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /api-linter && git add -A && git diff --cached --binary 05f34997e6e279f9069c9aebc5d9316db91ee49c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
