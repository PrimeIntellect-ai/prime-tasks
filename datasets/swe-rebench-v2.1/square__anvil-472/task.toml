[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /anvil && git add -A && git diff --cached --binary adf924f8ee86485f413a83d732f0d2258efe2d87 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
