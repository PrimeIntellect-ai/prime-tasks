[task]
name = "ibragim-badertdinov/platers__obsidian-linter-523"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "platers/obsidian-linter"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/obsidian-linter"
docker_image = "docker.io/swerebenchv2/platers-obsidian-linter:523-ffde901@sha256:906dd194f76e79103ada548c097e0db5c2378cfa3d018403250e4148d05d6944"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-linter && git add -A && git diff --cached --binary ffde90153b84d193ff8e57d97e92047fe7872293 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
