[task]
name = "ibragim-badertdinov/scalameta__scalameta-4150"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "scala"]
repo = "scalameta/scalameta"
language = "scala"
log_parser = "parse_log_scala_v2"
