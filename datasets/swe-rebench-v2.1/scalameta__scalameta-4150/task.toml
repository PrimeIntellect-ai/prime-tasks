[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /scalameta && git add -A && git diff --cached --binary d5274feaff69d65035abd356cdd34bb0cec6406e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
