[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /numbat && git add -A && git diff --cached --binary 82b7e6f51c5d55d86aa6946c94c1d5ac03364503 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
