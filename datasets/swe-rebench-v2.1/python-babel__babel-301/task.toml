[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /babel && git add -A && git diff --cached --binary 5d0c4ef8a55bc507650e9ff750328883d371d5c3 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
