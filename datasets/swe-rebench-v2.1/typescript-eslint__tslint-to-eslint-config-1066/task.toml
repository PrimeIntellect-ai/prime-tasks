[task]
name = "ibragim-badertdinov/typescript-eslint__tslint-to-eslint-config-1066"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "typescript-eslint/tslint-to-eslint-config"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/tslint-to-eslint-config"
docker_image = "docker.io/swerebenchv2/typescript-eslint-tslint-to-eslint-config:1066-bb27bc1@sha256:b7348c3938b99ec5f8abcb0a9a90198ba9d2d86488d15cd4ea816251237879e2"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /tslint-to-eslint-config && git add -A && git diff --cached --binary bb27bc1804f9012497f8a329eed2544a96784b95 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
