[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /mlxtend && git add -A && git diff --cached --binary e82c9c53fb4e30cff7312af5fe663075564049a7 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
