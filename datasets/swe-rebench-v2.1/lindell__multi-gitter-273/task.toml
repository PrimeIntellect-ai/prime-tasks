[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /multi-gitter && git add -A && git diff --cached --binary ad5bb777a6b2817b69364b4e1d72ef2b0ac0295c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
