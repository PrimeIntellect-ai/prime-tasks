[task]
name = "ibragim-badertdinov/solid__community-server-168"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "solid/community-server"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/community-server"
docker_image = "docker.io/swerebenchv2/solid-community-server:168-f6f45c0@sha256:e52327dbf1cac7389489c14bd6f02310609b7f121001648de26069b53c13c509"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /community-server && git add -A && git diff --cached --binary f6f45c0ece35ed72c14224925e4711ae4d756520 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
