[task]
name = "ibragim-badertdinov/semantic-release__gitlab-353"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "semantic-release/gitlab"
language = "js"
log_parser = "parse_log_js"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/gitlab"
docker_image = "docker.io/swerebenchv2/semantic-release-gitlab:353-e6fa727@sha256:7700dea8e95f6eea1c12d1c3fb3a62585fe0a08cf30fd75e6ffd3275f85afd1c"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /gitlab && git add -A && git diff --cached --binary e6fa727a99e683eb636597664d58ae7b534622d1 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
