[task]
name = "ibragim-badertdinov/ioos__compliance-checker-978"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "ioos/compliance-checker"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/compliance-checker"
docker_image = "docker.io/swerebenchv2/ioos-compliance-checker:978-c06cce8@sha256:e702a8b3970492a6abc1c4e1475ee10975a32cc28d914876089e5d2bcc9f9d57"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /compliance-checker && git add -A && git diff --cached --binary c06cce8e7998ebff79b0ae32addf1866bd7d11ca > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
