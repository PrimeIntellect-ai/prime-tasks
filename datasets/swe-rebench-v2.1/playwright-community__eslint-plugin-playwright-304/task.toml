[task]
name = "ibragim-badertdinov/playwright-community__eslint-plugin-playwright-304"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "playwright-community/eslint-plugin-playwright"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-playwright"
docker_image = "docker.io/swerebenchv2/playwright-community-eslint-plugin-playwright:304-92e9240@sha256:c5b75f19fa44643c41d9876bbc591eec80b23d6c852c3c7ac3ca74556a3f885f"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-playwright && git add -A && git diff --cached --binary 92e9240d51671b55465adc83c21983dbe2e0707c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
