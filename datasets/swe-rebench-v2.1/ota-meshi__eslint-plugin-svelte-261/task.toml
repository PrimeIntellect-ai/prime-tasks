[task]
name = "ibragim-badertdinov/ota-meshi__eslint-plugin-svelte-261"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "ota-meshi/eslint-plugin-svelte"
language = "ts"
log_parser = "parse_log_js"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-svelte"
docker_image = "docker.io/swerebenchv2/ota-meshi-eslint-plugin-svelte:261-dbb37ae@sha256:2cf99d8a8a2fc82e8fb17bfc7f3c4ee012540b67ad1d19607812b5a4e5b40757"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-svelte && git add -A && git diff --cached --binary dbb37ae08eaad62f993e62b934c5f3db4a6b09ea > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
