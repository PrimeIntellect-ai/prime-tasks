[task]
name = "ibragim-badertdinov/ontodev__robot-710"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "java"]
repo = "ontodev/robot"
language = "java"
log_parser = "parse_java_mvn"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/robot"
docker_image = "docker.io/swerebenchv2/ontodev-robot:710-691d0dd@sha256:4db83250e0b59eb6d1a475f19afcee5c07fea606fea50fee0f535876f3263cee"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /robot && git add -A && git diff --cached --binary 691d0dd57b97309da2e05b86bc0d6bcace1ecf78 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
