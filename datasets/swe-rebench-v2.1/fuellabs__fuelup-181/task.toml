[task]
name = "ibragim-badertdinov/fuellabs__fuelup-181"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "FuelLabs/fuelup"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/fuelup"
docker_image = "docker.io/swerebenchv2/fuellabs-fuelup:181-e5b00d2@sha256:8b8a5a2ad9cae229dd7089fe9b1c083baa1cab6b511b64caf31e58ee52cf0488"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /fuelup && git add -A && git diff --cached --binary e5b00d25c7057f7bcb7fd3c5c1900c4804c1de26 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
