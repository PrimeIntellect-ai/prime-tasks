cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/validator"
docker_image = "docker.io/swerebenchv2/go-playground-validator:746-f6584a4@sha256:63fb8e50b6520665f14b35518b2ba7fe9a4f88b6c97f5f3ecbeb9672b9a96d12"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /validator && git add -A && git diff --cached --binary f6584a41c8acc5dfc0b62f7962811f5231c11530 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
