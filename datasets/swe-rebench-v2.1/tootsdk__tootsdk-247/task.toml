[task]
name = "ibragim-badertdinov/tootsdk__tootsdk-247"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "swift"]
repo = "TootSDK/TootSDK"
language = "swift"
log_parser = "parse_log_swift"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/TootSDK"
docker_image = "docker.io/swerebenchv2/tootsdk-tootsdk:247-3c90401@sha256:1ee1f0e065d74a02465e1585143ec3e12c902c0aa0677c518dcd4688dd424865"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /TootSDK && git add -A && git diff --cached --binary 3c9040115da0f20a49434a264c9043b3b35d6834 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
