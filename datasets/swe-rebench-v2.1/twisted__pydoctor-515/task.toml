[task]
name = "ibragim-badertdinov/twisted__pydoctor-515"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "twisted/pydoctor"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/pydoctor"
docker_image = "docker.io/swerebenchv2/twisted-pydoctor:515-76d3b86@sha256:9ed16e448d641e6382dfc5b32a2fd91004aa13978897d7a7117bff08cb2c378a"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pydoctor && git add -A && git diff --cached --binary 76d3b86424a9275046b7aa843179856bd5e46dcc > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
