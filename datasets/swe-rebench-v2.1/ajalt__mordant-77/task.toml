[task]
name = "ibragim-badertdinov/ajalt__mordant-77"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "kotlin"]
repo = "ajalt/mordant"
language = "kotlin"
log_parser = "parse_log_gradlew_v1"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/mordant"
docker_image = "docker.io/swerebenchv2/ajalt-mordant:77-f1a020c@sha256:f62a3425e8398fc6473e01a068a8ac0408ab06cc97cc8685045c4fd3e069ea63"
env = { _JAVA_OPTIONS = "" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /mordant && git add -A && git diff --cached --binary f1a020c69bfebaf8c0a827ab89218c6fcc8edde3 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
