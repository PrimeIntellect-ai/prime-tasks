[task]
name = "ibragim-badertdinov/pytask-dev__pytask-218"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "pytask-dev/pytask"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/pytask"
docker_image = "docker.io/swerebenchv2/pytask-dev-pytask:218-0d7be2d@sha256:40c4376fafd727a86d107ec3516e9b75736fee6e480bb65aa459361af5876094"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pytask && git add -A && git diff --cached --binary 0d7be2daad469c50c3efd30fed8937e41cf57d31 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
