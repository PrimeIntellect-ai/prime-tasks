[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-linter && git add -A && git diff --cached --binary ef0922560ece3ee846b0f8f8e6ddef177c28b051 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
