[task]
name = "ibragim-badertdinov/spdx__tools-golang-210"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "spdx/tools-golang"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/tools-golang"
docker_image = "docker.io/swerebenchv2/spdx-tools-golang:210-ee0b98b@sha256:c69159c44a9ca015bc2975b5e831fee208f7ba349e69fcdbd112f00dcdc0ed05"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /tools-golang && git add -A && git diff --cached --binary ee0b98bce00f50878120ac3ba725ba0396d6cfb7 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
