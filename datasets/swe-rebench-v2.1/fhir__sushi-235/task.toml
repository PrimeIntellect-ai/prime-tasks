[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/sushi"
docker_image = "docker.io/swerebenchv2/fhir-sushi:235-64c6365@sha256:bbd5989c84a4a912a466a2bff1e4f2930ab9682c36873f7fc0f7f36a33ee88c3"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sushi && git add -A && git diff --cached --binary 64c636575578603a6c045cb256a20aed4dc1f66c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
