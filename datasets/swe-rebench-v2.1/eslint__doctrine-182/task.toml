[task]
name = "ibragim-badertdinov/eslint__doctrine-182"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "eslint/doctrine"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/doctrine"
docker_image = "docker.io/swerebenchv2/eslint-doctrine:182-46c600f@sha256:dd115650bc33bd12e5f2c27413cc5a24babf2c72532f5040b51b68b382aa010e"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /doctrine && git add -A && git diff --cached --binary 46c600f27f54b3ab6b0b8a9ac9f97c807ffa95ef > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
