[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /laravel-backup && git add -A && git diff --cached --binary 1ee00b91e1862b488aa53cfe34f793b5b273b2dd > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
