[task]
name = "ibragim-badertdinov/softwaremill__sttp-openai-41"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "scala"]
repo = "softwaremill/sttp-openai"
language = "scala"
log_parser = "parse_log_scala_v3"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/sttp-openai"
docker_image = "docker.io/swerebenchv2/softwaremill-sttp-openai:41-7ddcc2c@sha256:c98cd7aad21df960b4c968cda9e68d455bd4313cbfa94f44b9dad2e8757f0d79"
env = { _JAVA_OPTIONS = "" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sttp-openai && git add -A && git diff --cached --binary 7ddcc2c5fbc796c3c585c545ce5aadfccd0e949b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
