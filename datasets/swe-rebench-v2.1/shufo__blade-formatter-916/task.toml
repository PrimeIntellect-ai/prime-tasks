[task]
name = "ibragim-badertdinov/shufo__blade-formatter-916"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "shufo/blade-formatter"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/blade-formatter"
docker_image = "docker.io/swerebenchv2/shufo-blade-formatter:916-0678078@sha256:a1e77b49d0acbf1bc4ac1d01afec8eecccbb92997a889133fa067d6a271ffba9"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /blade-formatter && git add -A && git diff --cached --binary 06780787ed63ed9d239dad61949db9ca72a3abac > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
