[task]
name = "ibragim-badertdinov/pydicom__pynetdicom-996"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "pydicom/pynetdicom"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = ["weak_f2p"]

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/pynetdicom"
docker_image = "docker.io/swerebenchv2/pydicom-pynetdicom:996-dcd8f3c@sha256:1b0d65ae029fb6a9d802c81a66782919a976de05f4a14df4fc17de32bd2ce151"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pynetdicom && git add -A && git diff --cached --binary dcd8f3c16a424a2d3cef9a5e86c0ab8ba6d5e811 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
