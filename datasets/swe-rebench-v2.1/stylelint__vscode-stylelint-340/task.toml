[task]
name = "ibragim-badertdinov/stylelint__vscode-stylelint-340"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "stylelint/vscode-stylelint"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/vscode-stylelint"
docker_image = "docker.io/swerebenchv2/stylelint-vscode-stylelint:340-fd1f84a@sha256:c7699539f50c980ee8183c976dfd1df9206e07cf59b0733f32fd42adf2c2b0b1"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /vscode-stylelint && git add -A && git diff --cached --binary fd1f84af199fdda7c8019f67c38504a2aff1f68f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
