[task]
name = "ibragim-badertdinov/cypress-io__eslint-plugin-cypress-13"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "cypress-io/eslint-plugin-cypress"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-cypress"
docker_image = "docker.io/swerebenchv2/cypress-io-eslint-plugin-cypress:13-02391a0@sha256:972f974b075ac4fffd2d0757fc5fc143c773759e0148e837ded413bede7e3dcd"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-cypress && git add -A && git diff --cached --binary 02391a0b9192a96b542d23dc31e6994cdcc2066f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
