[task]
name = "ibragim-badertdinov/semantic-release__github-876"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "semantic-release/github"
language = "js"
log_parser = "parse_log_js"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/github"
docker_image = "docker.io/swerebenchv2/semantic-release-github:876-500240b@sha256:12a1ffe2dc6155d7e7091030b28f34dfa3b630afa47e3dd512e1dcf860bd136d"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /github && git add -A && git diff --cached --binary 500240b93100427da71de2e565604fc6c511a4bf > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
