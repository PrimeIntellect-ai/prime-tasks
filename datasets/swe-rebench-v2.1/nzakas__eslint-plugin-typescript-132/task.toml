[task]
name = "ibragim-badertdinov/nzakas__eslint-plugin-typescript-132"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "nzakas/eslint-plugin-typescript"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-typescript"
docker_image = "docker.io/swerebenchv2/nzakas-eslint-plugin-typescript:132-5e410a3@sha256:fb1829593961532e4302e7486b7428a25ba6875d45d351b69b6d4ae809b0504a"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-typescript && git add -A && git diff --cached --binary 5e410a36c43d82ab679bed8a8ef68a655008fde9 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
