[task]
name = "ibragim-badertdinov/cpisciotta__xcbeautify-12"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "swift"]
repo = "cpisciotta/xcbeautify"
language = "swift"
log_parser = "parse_log_swift"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/xcbeautify"
docker_image = "docker.io/swerebenchv2/cpisciotta-xcbeautify:12-d7363b1@sha256:8d9a86a809caec2b92ec0adf982b7e6e366ee5916f27f221b073abb5c3a2e93e"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /xcbeautify && git add -A && git diff --cached --binary d7363b1990200996040b5aa79106536aa8b132d3 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
