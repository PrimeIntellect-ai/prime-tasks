[task]
name = "ibragim-badertdinov/jiangzhe__xngin-80"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "jiangzhe/xngin"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/xngin"
docker_image = "docker.io/swerebenchv2/jiangzhe-xngin:80-1efdae6@sha256:8400ea1e731688341f86c25a5b246429a5e1251b479aeddfb592fe06309cd208"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /xngin && git add -A && git diff --cached --binary 1efdae66748f3bb12c81391aeb0468485657518f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
