[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /cloudpickle && git add -A && git diff --cached --binary 06b18afa11eca21576f1a463e9ace27857f3e28f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
