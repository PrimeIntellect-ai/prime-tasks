[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /bootlint && git add -A && git diff --cached --binary 275b759ce5f62e0af09e21c72180a1b54f7e54c9 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
