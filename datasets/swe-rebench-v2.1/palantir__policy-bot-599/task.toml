[task]
name = "ibragim-badertdinov/palantir__policy-bot-599"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "palantir/policy-bot"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/policy-bot"
docker_image = "docker.io/swerebenchv2/palantir-policy-bot:599-51b4afb@sha256:3b7c1fb78f5e8e1227ba077e393a57acd3b8c2d665d6bc7c129e6c3d78abfad0"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /policy-bot && git add -A && git diff --cached --binary 51b4afb12257e1a3507c534cf91d2860d606296f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
