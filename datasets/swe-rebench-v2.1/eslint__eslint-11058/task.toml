[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint"
docker_image = "docker.io/swerebenchv2/eslint-eslint:11058-7ad86de@sha256:55153bc32ea077d60120d9c2deafaf00ea05fb7487f341ff01ded53b35dcca99"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint && git add -A && git diff --cached --binary 7ad86dea02feceb7631943a7e1423cc8a113fcfe > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
