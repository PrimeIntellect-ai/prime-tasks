[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /js-slang && git add -A && git diff --cached --binary 6ba914a379e5da34ae6a1d9124074fae1b0b8c55 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
