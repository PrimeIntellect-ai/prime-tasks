[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sql-formatter && git add -A && git diff --cached --binary b422cdba7a08833aad8e055c73f8944e60d3bedf > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
