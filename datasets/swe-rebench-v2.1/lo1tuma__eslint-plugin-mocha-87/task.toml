[task]
name = "ibragim-badertdinov/lo1tuma__eslint-plugin-mocha-87"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "lo1tuma/eslint-plugin-mocha"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-mocha"
docker_image = "docker.io/swerebenchv2/lo1tuma-eslint-plugin-mocha:87-3cafff5@sha256:a09438f6ca3ce5340cee9b7d9b1fbffaee3f2b24ffea7e7e145042e5cfac64e4"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-mocha && git add -A && git diff --cached --binary 3cafff506badb5969028ceddf958ca4e9cc8859b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
