[task]
name = "ibragim-badertdinov/ajalt__mordant-123"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "kotlin"]
repo = "ajalt/mordant"
language = "kotlin"
log_parser = "parse_log_gradlew_v1"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/mordant"
docker_image = "docker.io/swerebenchv2/ajalt-mordant:123-e45cdf9@sha256:e1185ed35664e48ea19c6d3ffa93502462042d79119c0b3cab7be0b1a14a3d28"
env = { _JAVA_OPTIONS = "" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /mordant && git add -A && git diff --cached --binary e45cdf90fc7e0029314ba4e9d273b5b34dfa0983 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
