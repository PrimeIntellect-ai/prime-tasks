[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rohd && git add -A && git diff --cached --binary 834fec64838194feb9a03bb38af86f0ca1aaf90d > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
