[task]
name = "ibragim-badertdinov/google__go-tpm-391"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "google/go-tpm"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/go-tpm"
docker_image = "docker.io/swerebenchv2/google-go-tpm:391-f37a5ca@sha256:513565454b7097042923d3a852f524ffef1ed4792587a630e5f569ecbadf9ca4"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /go-tpm && git add -A && git diff --cached --binary f37a5cab945313cd9e6276a7385145ebbaf5e2bd > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
