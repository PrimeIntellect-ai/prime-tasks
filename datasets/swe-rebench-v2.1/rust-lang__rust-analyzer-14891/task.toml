[task]
name = "ibragim-badertdinov/rust-lang__rust-analyzer-14891"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "rust-lang/rust-analyzer"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rust-analyzer"
docker_image = "docker.io/swerebenchv2/rust-lang-rust-analyzer:14891-efd3094@sha256:b9c8b62ee268b09993438d995e1b93829a38f40324da14d33bcb0797c2e6c1d0"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rust-analyzer && git add -A && git diff --cached --binary efd3094aba281de248f48e67b5b93bf2c557e16c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
