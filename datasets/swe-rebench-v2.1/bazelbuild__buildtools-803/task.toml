[task]
name = "ibragim-badertdinov/bazelbuild__buildtools-803"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "bazelbuild/buildtools"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/buildtools"
docker_image = "docker.io/swerebenchv2/bazelbuild-buildtools:803-5ea03ef@sha256:c6199ae27dbe731f55c9c1bc6cbae32be0eba13894fd63d56764cf7d0a1f7708"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /buildtools && git add -A && git diff --cached --binary 5ea03ef960faceeb0220b6cb36af17e974b2de1d > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
