[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rust-bindgen"
docker_image = "docker.io/swerebenchv2/rust-lang-rust-bindgen:2591-1d2b579@sha256:ce3fbd6651e8cf0093c7a60642eb349926339110c492a591c04275fa9046568f"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rust-bindgen && git add -A && git diff --cached --binary 1d2b579d1c3180e93089ffb1379ee11fac0cccc0 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
