[task]
name = "ibragim-badertdinov/innobi__pantab-15"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "innobi/pantab"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/pantab"
docker_image = "docker.io/swerebenchv2/innobi-pantab:15-cb8d7b9@sha256:ccbebd9ad4aacf17484553f601c2ca9e7bb421ef3d11d122b0126f5292eeb189"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pantab && git add -A && git diff --cached --binary cb8d7b9e8776993456ff34b0d72763a61465a999 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
