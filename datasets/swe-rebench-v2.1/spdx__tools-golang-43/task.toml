[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /tools-golang && git add -A && git diff --cached --binary 5a270f97f4106cf989761f9143e23132c1bffb3c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
