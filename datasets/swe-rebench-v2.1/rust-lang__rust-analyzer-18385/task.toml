[task]
name = "ibragim-badertdinov/rust-lang__rust-analyzer-18385"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "rust-lang/rust-analyzer"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rust-analyzer"
docker_image = "docker.io/swerebenchv2/rust-lang-rust-analyzer:18385-f9935be@sha256:ed11cca24bcbfa32af34bfb94c83abb63cceda18a4e88d168acd5e4310041088"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rust-analyzer && git add -A && git diff --cached --binary f9935be0132d461396ee4e82f7be446aa9aa112b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
