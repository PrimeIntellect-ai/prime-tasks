[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /git-cliff && git add -A && git diff --cached --binary 7d0786ca55423950f0779de4e6a907fc25ae203a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
