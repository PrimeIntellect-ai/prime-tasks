[task]
name = "ibragim-badertdinov/surface-ui__surface_formatter-56"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "elixir"]
repo = "surface-ui/surface_formatter"
language = "elixir"
log_parser = "parse_log_elixir"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/surface_formatter"
docker_image = "docker.io/swerebenchv2/surface-ui-surface-formatter:56-9d9e8df@sha256:a02a33fdaed66faa2d7702dda5a894c9af2f7e91467a3603b9ca7b764ef741b9"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /surface_formatter && git add -A && git diff --cached --binary 9d9e8df5669152f56243b11489aa9e37a1d1d463 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
