[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-linter && git add -A && git diff --cached --binary c0ff56a655a2add7501947e678e1e023e84c2a67 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
