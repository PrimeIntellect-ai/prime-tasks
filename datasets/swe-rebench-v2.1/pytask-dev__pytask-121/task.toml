[task]
name = "ibragim-badertdinov/pytask-dev__pytask-121"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "pytask-dev/pytask"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/pytask"
docker_image = "docker.io/swerebenchv2/pytask-dev-pytask:121-64e50ef@sha256:8e49e84596ef916a03b824218683a33b7c6757d3a94e74444b9c9c2d02dd8d45"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pytask && git add -A && git diff --cached --binary 64e50efa7bc0e99662133c90330977a60786ee38 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
