[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /typstyle && git add -A && git diff --cached --binary bc42bea46c6cc190ec10117e47b11aafa4395f93 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
