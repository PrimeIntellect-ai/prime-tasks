[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-vue && git add -A && git diff --cached --binary ca7daffb43ccfa09a58e6f10e4346142d38b5bd9 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
