[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-linter && git add -A && git diff --cached --binary f8b65be2c6ce921268e1d0efaa34dffb4d24c359 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
