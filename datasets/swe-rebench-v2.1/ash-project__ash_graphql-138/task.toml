[task]
name = "ibragim-badertdinov/ash-project__ash_graphql-138"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "elixir"]
repo = "ash-project/ash_graphql"
