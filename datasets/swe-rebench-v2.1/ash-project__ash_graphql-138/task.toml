[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /ash_graphql && git add -A && git diff --cached --binary f81cbeb22f68f89bcf6ed23206aafd1397d27080 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
