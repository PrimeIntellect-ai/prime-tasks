[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /PHP-CS-Fixer && git add -A && git diff --cached --binary 4fbbd57031b88f01a58a9176a86841bff3abe19a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
