[task]
name = "ibragim-badertdinov/denoland__deno_lint-1047"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "denoland/deno_lint"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/deno_lint"
docker_image = "docker.io/swerebenchv2/denoland-deno-lint:1047-b200528@sha256:b43c13934f1d7be96ad366cb6633839116b108b44b0e53f51292a71865b78e01"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /deno_lint && git add -A && git diff --cached --binary b200528129cefb5be6fcebc09c304170d0848acb > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
