[task]
name = "ibragim-badertdinov/eslint__css-61"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "eslint/css"
language = "js"
log_parser = "parse_log_js"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/css"
docker_image = "docker.io/swerebenchv2/eslint-css:61-a9692b0@sha256:04aecec9ba33e0a84c4dbc235b2fb92b000ba8032ba762e9aba0e8bfabb23e71"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /css && git add -A && git diff --cached --binary a9692b0fb198da2d8eb006da03d3396d322135f9 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
