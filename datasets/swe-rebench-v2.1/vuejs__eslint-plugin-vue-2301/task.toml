[task]
name = "ibragim-badertdinov/vuejs__eslint-plugin-vue-2301"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "vuejs/eslint-plugin-vue"
language = "js"
log_parser = "parse_log_js_2"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-vue"
docker_image = "docker.io/swerebenchv2/vuejs-eslint-plugin-vue:2301-15b99af@sha256:62ffa7ceceda843b42047a857e25a9dac08b5cfabdb3abc5e163d8d21ebd6409"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-vue && git add -A && git diff --cached --binary 15b99af0552c89b5f94667cf5e2a0a92f603d08d > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
