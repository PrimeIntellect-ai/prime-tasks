[task]
name = "ibragim-badertdinov/dotenv-linter__dotenv-linter-327"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "dotenv-linter/dotenv-linter"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/dotenv-linter"
docker_image = "docker.io/swerebenchv2/dotenv-linter-dotenv-linter:327-f6adeec@sha256:af3f41390e7b96d0db515a68e6db78f541de8a2caaf7ab001e345a815ca669a2"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /dotenv-linter && git add -A && git diff --cached --binary f6adeec541e774b81ed4af21c8e2fcbdd96db13e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
