[task]
name = "ibragim-badertdinov/platers__obsidian-linter-393"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "platers/obsidian-linter"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/obsidian-linter"
docker_image = "docker.io/swerebenchv2/platers-obsidian-linter:393-6127b66@sha256:8e8f9e7e9eb1cdc3149b75f610c6cb02bc179e783ebf04a3adb052be842e183a"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-linter && git add -A && git diff --cached --binary 6127b66afe453ffb0f793afd598e0e8f92cfa891 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
