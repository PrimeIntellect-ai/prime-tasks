[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /obsidian-linter && git add -A && git diff --cached --binary d3515fe32804f4ec495d993f10eabbf4b9fa6161 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
