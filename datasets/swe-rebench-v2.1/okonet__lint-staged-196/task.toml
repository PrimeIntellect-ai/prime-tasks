[task]
name = "ibragim-badertdinov/okonet__lint-staged-196"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "okonet/lint-staged"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/lint-staged"
docker_image = "docker.io/swerebenchv2/okonet-lint-staged:196-2bcbc5f@sha256:2c3815964dc1f07099fe4638c70b5ea0a6d8eef9571e15c0c87c217a020c5544"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /lint-staged && git add -A && git diff --cached --binary 2bcbc5f41abce233cf7b87e4cc04e2df62220606 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
