[task]
name = "ibragim-badertdinov/rust-lang__rustfmt-5060"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "rust-lang/rustfmt"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rustfmt"
docker_image = "docker.io/swerebenchv2/rust-lang-rustfmt:5060-c1eab15@sha256:156b526b58331d94c5052a0dbbd5f2636f721973b83c4d2043bce6bd8e0aa5c9"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rustfmt && git add -A && git diff --cached --binary c1eab154c9139a281d17c5ae70151bac4fcbf60f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
