[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /instance-manager && git add -A && git diff --cached --binary fa48faa1b59be6eeb2bb23c57e788a586284beb5 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
