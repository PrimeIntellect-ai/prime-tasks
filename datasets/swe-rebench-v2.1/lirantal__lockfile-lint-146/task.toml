[task]
name = "ibragim-badertdinov/lirantal__lockfile-lint-146"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "lirantal/lockfile-lint"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/lockfile-lint"
docker_image = "docker.io/swerebenchv2/lirantal-lockfile-lint:146-cb38c10@sha256:f3df28a792a0ffead7168b5d8eea4eeceb95f9518aee1b1beecd7d6688c61766"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /lockfile-lint && git add -A && git diff --cached --binary cb38c109e093f2b44e81ece0edaf2cb157492a4c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
