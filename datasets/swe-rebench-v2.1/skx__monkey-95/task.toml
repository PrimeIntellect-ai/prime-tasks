[task]
name = "ibragim-badertdinov/skx__monkey-95"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "skx/monkey"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/monkey"
docker_image = "docker.io/swerebenchv2/skx-monkey:95-0ed5fb8@sha256:c06c6bce052702f4ee8b65a2e042107c6e596b37d94a3e43bdfc48780553efda"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /monkey && git add -A && git diff --cached --binary 0ed5fb83ec74858a9ce1341c7f675bb850faab27 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
