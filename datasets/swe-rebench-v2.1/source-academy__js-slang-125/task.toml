[task]
name = "ibragim-badertdinov/source-academy__js-slang-125"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "source-academy/js-slang"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/js-slang"
docker_image = "docker.io/swerebenchv2/source-academy-js-slang:125-0b8f9fa@sha256:f65ddc8c1ac9e5dc0ffd0b629f318ef8a0b0c66a514babcb70b8aba3315263eb"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /js-slang && git add -A && git diff --cached --binary 0b8f9fa07ceeb92423621093f9bca3a096a64759 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
