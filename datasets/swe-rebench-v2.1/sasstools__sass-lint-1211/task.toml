[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sass-lint && git add -A && git diff --cached --binary e3914367d879caae51baed5adcb7c22018e718b0 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
