[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /cil && git add -A && git diff --cached --binary eb64242309e7a9b916d45e382eff87f27c6aab9c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
