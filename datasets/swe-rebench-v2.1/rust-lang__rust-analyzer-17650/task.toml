[task]
name = "ibragim-badertdinov/rust-lang__rust-analyzer-17650"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "rust-lang/rust-analyzer"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rust-analyzer"
docker_image = "docker.io/swerebenchv2/rust-lang-rust-analyzer:17650-8d489e2@sha256:8cf7ff04d752bea0784ef37054351cd47b66a479ccf54f3128bd0bf744f948b8"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rust-analyzer && git add -A && git diff --cached --binary 8d489e21eb1d288a1000dba26a721e6efd7f993a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
