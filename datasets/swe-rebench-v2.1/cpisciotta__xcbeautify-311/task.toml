[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /xcbeautify && git add -A && git diff --cached --binary de4629e58089c5a3cec2f9455c9fce6c44c7c877 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
