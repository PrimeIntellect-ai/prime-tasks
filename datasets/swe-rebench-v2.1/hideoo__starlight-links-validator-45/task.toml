[task]
name = "ibragim-badertdinov/hideoo__starlight-links-validator-45"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "HiDeoo/starlight-links-validator"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/starlight-links-validator"
docker_image = "docker.io/swerebenchv2/hideoo-starlight-links-validator:45-ff9e824@sha256:73191874e2f2bc22adec6dfaa2fc7dccdfa7bf47f099acbc25d977960eee78b7"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /starlight-links-validator && git add -A && git diff --cached --binary ff9e824fed676750805660b168ad28cc3c3321a2 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
