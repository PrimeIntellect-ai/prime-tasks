[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /arche && git add -A && git diff --cached --binary 2c385dcb085c88a2c885a8f9ef642542bc31091f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
