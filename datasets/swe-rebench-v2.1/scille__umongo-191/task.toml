[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /umongo && git add -A && git diff --cached --binary 7f8c4cd62e61d1a62a70706f1780248bb3c3ad2a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
