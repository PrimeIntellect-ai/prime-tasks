[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /terracost && git add -A && git diff --cached --binary efa3e2094471fdb8e64d47326670b90357b0abeb > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
