[task]
name = "ibragim-badertdinov/laminas__laminas-validator-372"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "php"]
repo = "laminas/laminas-validator"
language = "php"
log_parser = "parse_log_phpunit"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/laminas-validator"
docker_image = "docker.io/swerebenchv2/laminas-laminas-validator:372-57a421f@sha256:854b5578ef6d1032e236cdfaf685cd9f2e9a4c8edfa4d4ff7d28d6b307708264"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /laminas-validator && git add -A && git diff --cached --binary 57a421f89b8fe2056ed6b40907f5b47c8708051a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
