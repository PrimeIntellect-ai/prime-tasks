[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /conan && git add -A && git diff --cached --binary 1e0db58c6d96b162b16800cdbfa2f63d604543bf > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
