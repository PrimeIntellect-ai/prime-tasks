[task]
name = "ibragim-badertdinov/tootsdk__tootsdk-252"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "swift"]
repo = "TootSDK/TootSDK"
language = "swift"
log_parser = "parse_log_swift"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/TootSDK"
docker_image = "docker.io/swerebenchv2/tootsdk-tootsdk:252-5cce8fd@sha256:964330ae80f8ebe0e6990daae7df7bb55998c338779af3c4b4badfaa72405a66"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /TootSDK && git add -A && git diff --cached --binary 5cce8fd7142db4bb710977adb0e8afc00d547ecc > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
