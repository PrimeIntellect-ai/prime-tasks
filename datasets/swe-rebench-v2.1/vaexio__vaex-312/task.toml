[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /vaex && git add -A && git diff --cached --binary 5f449f326e4165344704c0867ddd0a288b9403fd > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
