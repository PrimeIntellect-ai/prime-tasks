[task]
name = "ibragim-badertdinov/ember-cli__eslint-plugin-ember-1635"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "ember-cli/eslint-plugin-ember"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-ember"
docker_image = "docker.io/swerebenchv2/ember-cli-eslint-plugin-ember:1635-f394d8b@sha256:8aef6db4269b74ca79ff9e66703e130b929a63041231099cfef756f8fee52348"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-ember && git add -A && git diff --cached --binary f394d8bf9708938c57723bb5a54b63809551d315 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
