[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /argh && git add -A && git diff --cached --binary f3da6ae16c87537bec6a2a6571568cc2a0b47653 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
