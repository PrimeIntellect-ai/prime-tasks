[task]
name = "ibragim-badertdinov/amperity__vault-clj-91"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "clojure"]
repo = "amperity/vault-clj"
language = "clojure"
log_parser = "parse_log_lein"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/vault-clj"
docker_image = "docker.io/swerebenchv2/amperity-vault-clj:91-d229db2@sha256:33afb746d8b03196a0820a1f4090aa0e82aaa38f2e95215580a4f570465e8b69"
env = { JAVA_TOOL_OPTIONS = "-Dfile.encoding=UTF-8" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /vault-clj && git add -A && git diff --cached --binary d229db2343c28c35aa634b3176476afda10bc5e5 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
