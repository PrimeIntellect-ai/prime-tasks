[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/task"
docker_image = "docker.io/swerebenchv2/go-task-task:211-6ff9ba9@sha256:e22995c8bf827924a9cc8f440f5a62499333560d6c06deafa258b276d0447679"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /task && git add -A && git diff --cached --binary 6ff9ba9df9bfb204097e8d4748a315130d4009e6 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
