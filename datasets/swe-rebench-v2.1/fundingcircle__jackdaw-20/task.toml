[task]
name = "ibragim-badertdinov/fundingcircle__jackdaw-20"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "clojure"]
repo = "FundingCircle/jackdaw"
language = "clojure"
log_parser = "parse_log_lein"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/jackdaw"
docker_image = "docker.io/swerebenchv2/fundingcircle-jackdaw:20-05ba7b3@sha256:266cf069b926d3f8babca42c3bb32207f9cb21086dd94bf8233eec34ed63527e"
env = { JAVA_TOOL_OPTIONS = "-Dfile.encoding=UTF-8" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /jackdaw && git add -A && git diff --cached --binary 05ba7b392847944963bbb1fae95ce617c24e5f62 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
