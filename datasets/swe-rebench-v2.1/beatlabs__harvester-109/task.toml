[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /harvester && git add -A && git diff --cached --binary c880c51c28b1f5d961571e6e10685be4aa94a46d > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
