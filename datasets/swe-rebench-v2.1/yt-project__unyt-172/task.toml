[task]
name = "ibragim-badertdinov/yt-project__unyt-172"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "yt-project/unyt"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/unyt"
docker_image = "docker.io/swerebenchv2/yt-project-unyt:172-14e4cdb@sha256:8fc60010f2cedecfab5aaf67e1a0064922178082d4f725124d20987fd889bc31"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /unyt && git add -A && git diff --cached --binary 14e4cdbeeaf6a27ff8a678a2f0a23d32bf8f1b64 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
