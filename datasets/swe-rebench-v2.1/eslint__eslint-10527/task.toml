[task]
name = "ibragim-badertdinov/eslint__eslint-10527"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "eslint/eslint"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint"
docker_image = "docker.io/swerebenchv2/eslint-eslint:10527-caeb223@sha256:e2b8169dce1a61bdd853624a2c4fbc4d2b9a3dceceb86adf834f2a3bb1faef95"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint && git add -A && git diff --cached --binary caeb223c4f7b0b6fe35e5348ae0df4c6446b5bed > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
