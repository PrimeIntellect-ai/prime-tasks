[task]
name = "ibragim-badertdinov/ember-cli__eslint-plugin-ember-993"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "ember-cli/eslint-plugin-ember"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-ember"
docker_image = "docker.io/swerebenchv2/ember-cli-eslint-plugin-ember:993-d7ba535@sha256:5999a04eb38572904458f469954414b7c610922896663fd7dc03e4843e414c91"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-ember && git add -A && git diff --cached --binary d7ba535f605a082998f99b686288b5698746cfe0 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
