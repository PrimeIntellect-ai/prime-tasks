[task]
name = "ibragim-badertdinov/kubernetes-csi__external-snapshotter-289"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "kubernetes-csi/external-snapshotter"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/external-snapshotter"
docker_image = "docker.io/swerebenchv2/kubernetes-csi-external-snapshotter:289-d6be7e1@sha256:a4e5e1429c31db4501a73dd5cc530c3ad1a6f7f1321c86350392aa77053e0286"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /external-snapshotter && git add -A && git diff --cached --binary d6be7e120dcaf1018eebaa6e5e1ab41c3aeb6fee > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
