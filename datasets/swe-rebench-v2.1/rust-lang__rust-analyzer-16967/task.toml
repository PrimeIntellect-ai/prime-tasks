[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rust-analyzer"
docker_image = "docker.io/swerebenchv2/rust-lang-rust-analyzer:16967-899db83@sha256:7b6f56600479904332ebaebefaffac228d1d21b36d76bd5c48db84f70523b7ca"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rust-analyzer && git add -A && git diff --cached --binary 899db83128a151359bb1c58f6ede7f663635e2b1 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
