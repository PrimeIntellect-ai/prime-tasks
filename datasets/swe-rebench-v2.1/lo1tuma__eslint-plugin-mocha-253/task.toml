[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-mocha && git add -A && git diff --cached --binary d095e93cfcd2031e8626d58a6e21013f3d05580b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
