[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /fastify-gql && git add -A && git diff --cached --binary dc13ee422562d45ec70b1906db178a44de21fd83 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
