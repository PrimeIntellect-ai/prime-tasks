[task]
name = "ibragim-badertdinov/typescript-eslint__tslint-to-eslint-config-235"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "ts"]
repo = "typescript-eslint/tslint-to-eslint-config"
language = "ts"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/tslint-to-eslint-config"
docker_image = "docker.io/swerebenchv2/typescript-eslint-tslint-to-eslint-config:235-bd694e7@sha256:bb543dd2cbcfdf464aae0403044668730f6fb0026f84d50cf37791e3cd1c6792"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /tslint-to-eslint-config && git add -A && git diff --cached --binary bd694e701bc0260ef81719792d4ab646aa7686fa > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
