[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /raviger && git add -A && git diff --cached --binary ea4a3f5a345268bd56af9f0716b7e49bc936d32a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
