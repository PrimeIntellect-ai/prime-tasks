[task]
name = "ibragim-badertdinov/superlistapp__super_editor-2516"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "dart"]
repo = "superlistapp/super_editor"
language = "dart"
log_parser = "parse_log_dart"
quality_flags = []

[verifier]
