[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /super_editor && git add -A && git diff --cached --binary 96eb788b331aa9890badd3eb5f24a47a89b21c4f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
