[task]
name = "ibragim-badertdinov/friendsofphp__php-cs-fixer-6117"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "php"]
repo = "FriendsOfPHP/PHP-CS-Fixer"
language = "php"
log_parser = "parse_log_phpunit"
quality_flags = ["weak_f2p"]

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/PHP-CS-Fixer"
docker_image = "docker.io/swerebenchv2/friendsofphp-php-cs-fixer:6117-07430f5@sha256:2bc6cf92d840729abd491790752b6b151a94bae2e57efcb9a4ae5ad9837cbe05"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /PHP-CS-Fixer && git add -A && git diff --cached --binary 07430f5aca4874476bf175317cfb6284cd80421a > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
