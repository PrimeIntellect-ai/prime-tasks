[task]
name = "ibragim-badertdinov/rust-lang__rustfmt-5064"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "rust-lang/rustfmt"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rustfmt"
docker_image = "docker.io/swerebenchv2/rust-lang-rustfmt:5064-e75c4d7@sha256:7200f7159378c8ac3e2c9afbfcff23290a1675549a9a503a6bca81a396e6584f"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rustfmt && git add -A && git diff --cached --binary e75c4d7ee9a48b8599a3a61d3b79ccbe0a18d77e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
