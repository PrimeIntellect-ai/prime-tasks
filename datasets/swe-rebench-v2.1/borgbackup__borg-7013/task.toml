[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /borg && git add -A && git diff --cached --binary c5352000a773d908583a3bcb0510ecbf509932db > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
