[task]
name = "ibragim-badertdinov/google__go-github-1997"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "google/go-github"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/go-github"
docker_image = "docker.io/swerebenchv2/google-go-github:1997-465df60@sha256:ceac5cf64ee1ec7946aff0544c0f54e133c13c3b8d79fb5db54bb4648c4989ab"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /go-github && git add -A && git diff --cached --binary 465df60a8ec328f884da45b04b52fdb37d8adf98 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
