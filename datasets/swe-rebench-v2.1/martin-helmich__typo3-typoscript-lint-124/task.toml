[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /typo3-typoscript-lint && git add -A && git diff --cached --binary e76fbd472006cbadccc878b3f103e2fc305129a1 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
