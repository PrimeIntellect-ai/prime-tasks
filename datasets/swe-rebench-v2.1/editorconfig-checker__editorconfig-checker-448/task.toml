[task]
name = "ibragim-badertdinov/editorconfig-checker__editorconfig-checker-448"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "editorconfig-checker/editorconfig-checker"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/editorconfig-checker"
docker_image = "docker.io/swerebenchv2/editorconfig-checker-editorconfig-checker:448-65b01f3@sha256:6cacc0012f0c67a938fb4c61a218e52a8ebfebcc5d8e62ebfc910960542d4f92"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /editorconfig-checker && git add -A && git diff --cached --binary 65b01f3bb4855a2ca01a36e295225518f5469677 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
