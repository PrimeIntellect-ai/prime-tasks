[task]
name = "ibragim-badertdinov/semantic-release__gitlab-184"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "semantic-release/gitlab"
language = "js"
log_parser = "parse_log_js"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/gitlab"
docker_image = "docker.io/swerebenchv2/semantic-release-gitlab:184-ff48a65@sha256:fa7cbf1cf84a6f9770753c62d7f52f6fa72b38b26fb9058c0a96b252d939fa2e"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /gitlab && git add -A && git diff --cached --binary ff48a654c2686afae0c647304e6251bcb8d7fba6 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
