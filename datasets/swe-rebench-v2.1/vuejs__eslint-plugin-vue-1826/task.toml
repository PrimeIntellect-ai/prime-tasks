[task]
name = "ibragim-badertdinov/vuejs__eslint-plugin-vue-1826"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "vuejs/eslint-plugin-vue"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-vue"
docker_image = "docker.io/swerebenchv2/vuejs-eslint-plugin-vue:1826-1ce68fa@sha256:0d20ea90e397bc5246bcfdf9912daf2035396e6ff8b2f46d42d5091db01bae80"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-vue && git add -A && git diff --cached --binary 1ce68fa9def2c7d6da7aa5020c731860d7027459 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
