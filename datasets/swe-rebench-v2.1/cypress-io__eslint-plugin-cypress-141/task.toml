[task]
name = "ibragim-badertdinov/cypress-io__eslint-plugin-cypress-141"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "cypress-io/eslint-plugin-cypress"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-cypress"
docker_image = "docker.io/swerebenchv2/cypress-io-eslint-plugin-cypress:141-abb8591@sha256:0b861e9a951decc5babb7b67a1ac093792cc80be22235cbf9964e46aa23e3126"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-cypress && git add -A && git diff --cached --binary abb85919cadd5f68333da2b34be371d42c076b69 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
