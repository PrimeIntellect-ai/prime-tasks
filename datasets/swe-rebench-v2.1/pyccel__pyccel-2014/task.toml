[task]
name = "ibragim-badertdinov/pyccel__pyccel-2014"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "pyccel/pyccel"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/pyccel"
docker_image = "docker.io/swerebenchv2/pyccel-pyccel:2014-08efed8@sha256:33b3bdb6124ae72265c5ed5154990b31a42ffe7d52bbe60899d2507a8c6c3443"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pyccel && git add -A && git diff --cached --binary 08efed8e9378d5a4c9b9214a4daee65b5dc0e533 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
