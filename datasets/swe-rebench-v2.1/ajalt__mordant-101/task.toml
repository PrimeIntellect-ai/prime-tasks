[task]
name = "ibragim-badertdinov/ajalt__mordant-101"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "kotlin"]
repo = "ajalt/mordant"
language = "kotlin"
log_parser = "parse_log_gradlew_v1"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/mordant"
docker_image = "docker.io/swerebenchv2/ajalt-mordant:101-3a344a7@sha256:1e0bff27d3df351f1cf1ee2967a9316cea8f99ca94d9596b933e49620dd9221f"
env = { _JAVA_OPTIONS = "" }

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /mordant && git add -A && git diff --cached --binary 3a344a7ce17e312684e68beb539cb5fe557242d8 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
