[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-tailwindcss && git add -A && git diff --cached --binary 7fdbbdb03cba7240d2839ee95d7eda54af5837a0 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
