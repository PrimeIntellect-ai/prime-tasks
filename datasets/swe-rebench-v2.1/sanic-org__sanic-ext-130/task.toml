[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /sanic-ext && git add -A && git diff --cached --binary 0d862f5d624243e9115d3f517983f4bec23e43d5 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
