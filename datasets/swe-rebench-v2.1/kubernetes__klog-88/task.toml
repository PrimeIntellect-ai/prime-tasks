[task]
name = "ibragim-badertdinov/kubernetes__klog-88"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "kubernetes/klog"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/klog"
docker_image = "docker.io/swerebenchv2/kubernetes-klog:88-3ca30a5@sha256:2b3bc46458f5e5df9fc36b2e341ec8546ae320b5cc6cec45cfd570eef8852a61"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /klog && git add -A && git diff --cached --binary 3ca30a56d8a775276f9cdae009ba326fdc05af7f > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
