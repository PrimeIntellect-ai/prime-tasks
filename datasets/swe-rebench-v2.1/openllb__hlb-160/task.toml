[task]
name = "ibragim-badertdinov/openllb__hlb-160"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "openllb/hlb"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/hlb"
docker_image = "docker.io/swerebenchv2/openllb-hlb:160-532bacc@sha256:1e2a44ce73bcd1b1834c07763457664cbfafa9fcce8e875d525514d5a075e3b5"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /hlb && git add -A && git diff --cached --binary 532bacc7850390dcf8e1a458e050c69110f8a926 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
