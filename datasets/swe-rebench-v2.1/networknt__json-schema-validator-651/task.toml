[task]
name = "ibragim-badertdinov/networknt__json-schema-validator-651"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "java"]
repo = "networknt/json-schema-validator"
language = "java"
log_parser = "parse_java_mvn"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/json-schema-validator"
docker_image = "docker.io/swerebenchv2/networknt-json-schema-validator:651-5b15c46@sha256:06adf511e2c333a02cba8ff20348b6ee3701d5ee12ceb5e9b44d6bfa6a77e25d"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /json-schema-validator && git add -A && git diff --cached --binary 5b15c4618e4dc2f7a2abe11ced979b3ec787d5c8 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
