[task]
name = "ibragim-badertdinov/rwjblue__ember-cli-template-lint-49"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "rwjblue/ember-cli-template-lint"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/ember-cli-template-lint"
docker_image = "docker.io/swerebenchv2/rwjblue-ember-cli-template-lint:49-7d9ea38@sha256:00179aebb00128c95e0fcea194d853d96833a0ef0a042748092c5282b01c4279"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /ember-cli-template-lint && git add -A && git diff --cached --binary 7d9ea38f60e0887bc34473eeb2ed625bf7c0d8cc > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
