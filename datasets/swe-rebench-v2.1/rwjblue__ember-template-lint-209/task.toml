[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /ember-template-lint && git add -A && git diff --cached --binary bfffaa18b0a14b4c5155cc048f2bb8f341b3783c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
