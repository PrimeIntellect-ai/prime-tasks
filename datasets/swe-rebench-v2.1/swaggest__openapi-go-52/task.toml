[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /openapi-go && git add -A && git diff --cached --binary b0eb17d3a61426446416b3c517b138ed0ddf1d67 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
