[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /anvil && git add -A && git diff --cached --binary 57ad43063fcb2298c8ce7bd8c9d4bd4ea99ac7ec > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
