[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /ariadne-codegen && git add -A && git diff --cached --binary eefcc70e351e6b36ddd0c722a930b31a0377bb69 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
