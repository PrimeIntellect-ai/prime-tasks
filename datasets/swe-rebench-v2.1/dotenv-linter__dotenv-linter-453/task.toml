[task]
name = "ibragim-badertdinov/dotenv-linter__dotenv-linter-453"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "dotenv-linter/dotenv-linter"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/dotenv-linter"
docker_image = "docker.io/swerebenchv2/dotenv-linter-dotenv-linter:453-8c7eab3@sha256:07f015b9858feb7fc82aa9405b6fc8f0ae356228db7d19536f8be834204b9d35"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /dotenv-linter && git add -A && git diff --cached --binary 8c7eab35b29376bdcea43a53ee8681166438b7f4 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
