[task]
name = "ibragim-badertdinov/pyccel__pyccel-2015"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "pyccel/pyccel"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/pyccel"
docker_image = "docker.io/swerebenchv2/pyccel-pyccel:2015-6607b0d@sha256:d4f2f79aff9b5b99385c2331e4a30bf5617c817c2230652571478e808f76b9fb"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /pyccel && git add -A && git diff --cached --binary 6607b0d54bbcd17e7d4abffe8a9c6dd7bfbeeb8e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
