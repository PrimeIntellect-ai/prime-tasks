[task]
name = "ibragim-badertdinov/senth__minecraft-mod-manager-182"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "python"]
repo = "Senth/minecraft-mod-manager"
language = "python"
log_parser = "parse_log_pytest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/minecraft-mod-manager"
docker_image = "docker.io/swerebenchv2/senth-minecraft-mod-manager:182-1d1f1f8@sha256:53e742c250323447ec590429696c573681d1bdf2ca7011435ce991366158c3b5"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /minecraft-mod-manager && git add -A && git diff --cached --binary 1d1f1f8d2ad5e82a69a2cfd938a4acf577c0d542 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
