[task]
name = "ibragim-badertdinov/editorconfig-checker__editorconfig-checker-71"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "editorconfig-checker/editorconfig-checker"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/editorconfig-checker"
docker_image = "docker.io/swerebenchv2/editorconfig-checker-editorconfig-checker:71-07d17d0@sha256:36c1dc6dae07d1e46d78f7ae13bc7f921e05396f719718aaf4afbfd7200d428b"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /editorconfig-checker && git add -A && git diff --cached --binary 07d17d02a390caad093a7fc64c9586049e3eb94b > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
