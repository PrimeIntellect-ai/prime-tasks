[task]
name = "ibragim-badertdinov/rust-analyzer__rust-analyzer-491"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "rust-analyzer/rust-analyzer"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/rust-analyzer"
docker_image = "docker.io/swerebenchv2/rust-analyzer-rust-analyzer:491-f60153e@sha256:b0f32b0a2020b11cb1f2de7fbc406062e63a01c9735f04d12cc342401e0db7e8"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /rust-analyzer && git add -A && git diff --cached --binary f60153ee9e1d598c170743633448aa3ede8cb72e > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
