[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /glam-rs && git add -A && git diff --cached --binary fb8ef0f0a20ce773490bbbc292859bba855d88d8 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
