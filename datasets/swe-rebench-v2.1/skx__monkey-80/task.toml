[task]
name = "ibragim-badertdinov/skx__monkey-80"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "go"]
repo = "skx/monkey"
language = "go"
log_parser = "parse_log_gotest"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/monkey"
docker_image = "docker.io/swerebenchv2/skx-monkey:80-29357e4@sha256:0fa8a3e583c9ac1e7a8e99e1cb38ccfe912ae3eb32ff01c7d8cfe48abe5c3089"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /monkey && git add -A && git diff --cached --binary 29357e427d852c5c8ef2c628796f35a77d4d3cf8 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
