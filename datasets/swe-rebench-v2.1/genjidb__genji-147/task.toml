[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /genji && git add -A && git diff --cached --binary d7f1b4832108f9ff600d5bcbeb183080abccae89 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
