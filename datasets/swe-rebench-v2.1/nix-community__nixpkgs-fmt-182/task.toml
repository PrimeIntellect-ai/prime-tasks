[task]
name = "ibragim-badertdinov/nix-community__nixpkgs-fmt-182"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "rust"]
repo = "nix-community/nixpkgs-fmt"
language = "rust"
log_parser = "parse_log_cargo"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/nixpkgs-fmt"
docker_image = "docker.io/swerebenchv2/nix-community-nixpkgs-fmt:182-e22bb01@sha256:41aab556ad44ece2e90ff6f9b1705a71ae717cc8cb238958a536672761bcee7f"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /nixpkgs-fmt && git add -A && git diff --cached --binary e22bb01aa626e6c2a9d69b94e8e87608a5b3e588 > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
