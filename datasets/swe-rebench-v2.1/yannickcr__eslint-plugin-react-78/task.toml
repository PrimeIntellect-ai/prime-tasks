[task]
name = "ibragim-badertdinov/yannickcr__eslint-plugin-react-78"
authors = [{ name = "Nebius AI R&D", email = "ibragim-bad@nebius.com" }]

[metadata]
author_name = "Nebius AI R&D"
author_email = "ibragim-bad@nebius.com"
category = "debugging"
tags = ["swe-rebench", "swe-rebench-v2.1", "js"]
repo = "yannickcr/eslint-plugin-react"
language = "js"
log_parser = "parse_log_js_4"
quality_flags = []

[verifier]
environment_mode = "separate"
timeout_sec = 2400

[agent]
timeout_sec = 3000

[environment]
build_timeout_sec = 1800.0
cpus = 6
memory_mb = 24576
storage_mb = 32768
workdir = "/eslint-plugin-react"
docker_image = "docker.io/swerebenchv2/yannickcr-eslint-plugin-react:78-33a8be0@sha256:701d1ddb9e669dffa5d0a8f1758c68802f9ad59a7c96ae70e85b03dfc6b22a9d"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && { cd /eslint-plugin-react && git add -A && git diff --cached --binary 33a8be06b5622a98f902904a51c51e0f75fd2d6c > /logs/artifacts/model.patch || : > /logs/artifacts/model.patch; }"
timeout_sec = 900
